function renderOverall(res) {
  const html = [];
  html.push('<div class="summary-card">' + escapeHtml(res.summary) + '</div>');
  // 算法类型：离线按写法猜，分咬得紧就把两个都说出来
  const algos = res.algo || [];
  html.push('<h3 class="sec">算法类型</h3>');
  if (algos.length) {
    const top = algos[0];
    const second = algos[1];
    let title = top.name;
    if (second && (top.score - second.score) / Math.max(top.score, 1) < 0.2) {
      title = '可能是 ' + top.name + '，也可能是 ' + second.name;
    }
    html.push('<div class="algo-card"><div class="algo-name">' + escapeHtml(title) + '</div>' +
      '<ul class="algo-why">' + top.reasons.map(r => '<li>' + escapeHtml(r) + '</li>').join('') + '</ul>' +
      '<p class="muted" style="font-size:12px;margin:6px 0 0">离线按写法猜的，拿不准会更正；要准可以点下面 AI 详解让它一起说。</p></div>');
  } else {
    html.push('<div class="algo-card"><span class="muted">没看出典型算法——可能就是普通逻辑，或者写法跟常见套路不一样。</span></div>');
  }
  const defBlocks = res.blocks.filter(b => b.kind === 'def');
  const defs = [];
  res.classes.forEach(c => defs.push({ line: c.line, sig: 'class ' + c.name, kind: '类' }));
  res.funcs.forEach(f => defs.push({ line: f.line, sig: f.sig, kind: '函数' }));
  if (defBlocks.length) {
    // 用「第几行到第几行是什么块」代替原来的流水账，读起来跟代码结构对得上
    html.push('<h3 class="sec">结构</h3><div class="func-list">');
    defBlocks.forEach(b => {
      const rng = b.to > b.from ? '第 ' + (b.from + 1) + '–' + (b.to + 1) + ' 行' : '第 ' + (b.from + 1) + ' 行';
      html.push('<div class="func-item"><span class="ln">' + rng + '</span><span>' + escapeHtml(b.label) + '：</span><code>' + escapeHtml(b.name) + '</code></div>');
    });
    html.push('</div>');
  }
  if (res.steps.length) {
    html.push('<h3 class="sec">主要步骤</h3><ol class="steps">');
    res.steps.forEach(s => html.push('<li>' + escapeHtml(s) + '</li>'));
    html.push('</ol>');
  }
  if (!defBlocks.length && defs.length) {
    html.push('<h3 class="sec">定义清单</h3><div class="func-list">');
    defs.sort((a, b) => a.line - b.line).forEach(d => {
      html.push('<div class="func-item"><span class="ln">第 ' + d.line + ' 行</span><span>' + d.kind + '：</span><code>' + escapeHtml(d.sig) + '</code></div>');
    });
    html.push('</div>');
  }
  let langLine = langLabel(res.lang) + (res.autoLang ? '（自动识别' : '（手动指定');
  if (res.autoLang && res.candidates && res.candidates.length > 1) {
    langLine += '，候选 ' + res.candidates.slice(0, 3).map(c => c.label + ' ' + c.score).join(' · ') + (res.candidates.length > 3 ? ' …' : '');
  }
  if (res.autoLang && res.candidates && res.candidates.length === 0) langLine += '，没找到明显特征';
  langLine += '）';
  html.push('<p class="muted" style="font-size:12.5px;margin:14px 0 0">' + escapeHtml(langLine) +
    ' · 共 ' + res.stats.total + ' 行 · 有效 ' + res.stats.code + ' 行 · 空行 ' + res.stats.blank + ' 行' +
    ' · <button class="btn small" data-lang-fix="1" style="height:26px;padding:0 8px;font-size:12px">改语言</button></p>');
  $('tab-overall').innerHTML = html.join('');
}

function lineIsNoted(n) {
  return !!(n && n.note && n.tag !== 'blank' && !n.fallback);
}

const LINE_RENDER_LIMIT = 600;

function renderLineItem(res, idx) {
  const n = res.lineNotes[idx];
  const noted = lineIsNoted(n);
  const html = [];
  html.push('<div class="ln-item' + (noted ? '' : ' compact') + '" data-line="' + (idx + 1) + '">');
  html.push('<span class="ln-no">' + (idx + 1) + '</span>');
  if (noted) {
    html.push('<div class="ln-note' + (n.tag === 'ai' ? ' ai' : '') + '">' +
      '<span class="tag">' + escapeHtml(TAG_LABEL_AI[n.tag] || '说明') + '</span>' +
      '<span>' + escapeHtml(n.note) + '</span></div>');
  } else if (n && n.note) {
    // 规则没覆盖到：只给一句淡色的保守说明，不冒充正经解释（「只看要点」里会被筛掉）
    html.push('<div class="ln-note"><span class="fallback">' + escapeHtml(n.note) + '</span></div>');
  } else {
    html.push('<div class="ln-note"><span class="fallback">这一行还没讲</span></div>');
  }
  html.push('</div>');
  return html.join('');
}

function lineSrcHtml(res, idx) {
  return '<div class="src-line" data-line="' + (idx + 1) + '">' +
    '<span class="lineno">' + (idx + 1) + '</span>' +
    '<span class="code-body">' + renderTokens(res.tokenLines[idx] || []) + '</span></div>';
}

function renderLintBar(res) {
  const host = $('lintBar');
  if (!host) return;
  if (!LINT.on()) { host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;
  const list = (res && res.lint) || [];
  if (!list.length) {
    host.classList.add('ok');
    host.classList.remove('open');
    host.innerHTML = '<div class="lint-head">没查出明显问题 · <span class="muted">离线只看基础错误，语义问题得让 AI 看</span></div>';
    return;
  }
  host.classList.remove('ok');
  host.classList.toggle('open', lintOpen);
  const errors = list.filter(x => x.severity === 'error').length;
  const html = [];
  html.push('<div class="lint-head" data-toggle-lint="1">' +
    '<span>' + (errors ? errors + ' 处错误' : '没错误') + (list.length - errors ? ' · ' + (list.length - errors) + ' 处提醒' : '') + '</span>' +
    '<span class="muted">' + (lintOpen ? '收起' : '点开看') + '</span></div>');
  html.push('<div class="lint-list">');
  list.forEach(it => {
    html.push('<div class="lint-item ' + it.severity + '" data-jump="' + it.line + '">' +
      '<span class="ln">第 ' + it.line + ' 行</span>' +
      '<span class="msg">' + escapeHtml(it.msg) + '</span>' +
      (it.hint ? '<span class="hint">' + escapeHtml(it.hint) + '</span>' : '') +
      '</div>');
  });
  html.push('</div>');
  host.innerHTML = html.join('');
}

function renderLines(res) {
  setFilterCounts(res.lineTexts.length, res.notedCount);
  renderLintBar(res);
  const html = [];
  let rendered = 0;
  let capped = false;
  res.blocks.forEach(b => {
    if (capped) return;
    if (b.kind === 'blank') {
      if (lineFilter === 'noted') return;
      const label = b.to > b.from ? '第 ' + (b.from + 1) + '–' + (b.to + 1) + ' 行 · 空行' : '第 ' + (b.from + 1) + ' 行 · 空行';
      html.push('<div class="ln-gap">' + label + '</div>');
      return;
    }
    const lines = b.lines.filter(i => lineFilter === 'all' || lineIsNoted(res.lineNotes[i]));
    if (!lines.length) return;
    const rows = b.to - b.from + 1;
    // 超长块默认折叠，免得一屏全是代码
    const longBlock = rows > 200;
    html.push('<div class="ln-block' + (longBlock ? ' folded' : '') + '">');
    const rng = b.to > b.from ? '第 ' + (b.from + 1) + '–' + (b.to + 1) + ' 行' : '第 ' + (b.from + 1) + ' 行';
    const title = b.kind === 'def' ? (b.label + ' ' + b.name)
      : b.kind === 'comment' ? '注释' : '语句';
    html.push('<div class="ln-block-head" data-rows="' + rows + '">' +
      '<span class="rng">' + rng + '</span>' +
      '<span class="nm">' + escapeHtml(title) + '</span>' +
      '<span class="fold">' + (longBlock ? '展开 ' + rows + ' 行' : '折叠') + '</span></div>');
    html.push('<div class="ln-src">');
    for (let k = b.from; k <= b.to; k++) {
      if (lineFilter === 'noted' && !lineIsNoted(res.lineNotes[k])) continue;
      html.push(lineSrcHtml(res, k));
    }
    html.push('</div>');
    for (const idx of lines) {
      if (rendered >= LINE_RENDER_LIMIT) { capped = true; break; }
      html.push(renderLineItem(res, idx));
      rendered++;
    }
    html.push('</div>');
  });
  if (!rendered && !html.length) html.push('<div class="empty">没有符合筛选的行。</div>');
  if (capped) html.push('<div class="empty">超过 ' + LINE_RENDER_LIMIT + ' 行，只渲染前 ' + LINE_RENDER_LIMIT + ' 行；剩下可以先看整体或词表。</div>');
  $('tab-lines').innerHTML = html.join('');
}

/* ---------- 语言候选弹层 ---------- */
function renderLangSheet(res) {
  const cands = (res && res.candidates) ? res.candidates.slice() : [];
  const byId = new Map(cands.map(c => [c.id, c]));
  const ids = Object.keys(LANGS);
  const top = cands.length ? cands[0].score : 1;
  const rows = ids.map(id => {
    const c = byId.get(id);
    return {
      id,
      label: langLabel(id),
      score: c ? c.score : 0,
      reasons: c ? c.reasons : [],
      current: res && res.lang === id
    };
  }).sort((a, b) => b.score - a.score || a.label.localeCompare(b.label));
  const html = [];
  let sepDone = false;
  rows.forEach(r => {
    if (r.score === 0 && !sepDone) {
      sepDone = true;
      html.push('<div class="lang-sep">其他语言（这段代码里没有它们的特征，想按它们解释也可以点）</div>');
    }
    const pct = r.score ? Math.max(8, Math.round(r.score / top * 100)) : 0;
    html.push('<button class="lang-item' + (r.current ? ' current' : '') + '" data-lang="' + r.id + '">');
    html.push('<span class="li-top"><span class="li-name">' + escapeHtml(r.label) + '</span>');
    if (r.current) html.push('<span class="li-cur">当前</span>');
    html.push('<span class="li-score">' + (r.score ? r.score + ' 分' : '没信号') + '</span></span>');
    html.push('<span class="li-bar"><i style="width:' + pct + '%"></i></span>');
    if (r.reasons.length) html.push('<span class="li-why">' + escapeHtml(r.reasons.slice(0, 3).join('、')) + '</span>');
    html.push('</button>');
  });
  $('langList').innerHTML = html.join('');
}

/* ---------- AI 通道 ---------- */
const AI = {
  on: () => LS.get('ce.aion', '0') === '1',
  key: () => LS.get('ce.aikey', ''),
  base: () => (LS.get('ce.aibase', '') || 'https://api.deepseek.com').replace(/\/+$/, ''),
  model: () => LS.get('ce.aimodel', 'deepseek-flash'),
  // 讲法档位：off = 不思考（默认，最省）/ low / high / rage（顶配 + 两轮）
  think: () => {
    const v = LS.get('ce.aithink', 'off');
    return v === 'low' || v === 'high' || v === 'rage' ? v : 'off';
  },
  ready() { return this.on() && !!this.key(); }
};
// 改了提示词就 +1：缓存 key 里带着它，老用户不会读到旧的硬文案
const PROMPT_VER = 2;
const AI_USAGE = {
  get total() { return parseInt(LS.get('ce.aitok', '0'), 10) || 0; },
  session: 0,
  add(u) {
    const t = (u && u.total_tokens) || 0;
    this.session += t;
    LS.set('ce.aitok', String(this.total + t));
    updateUsageText();
  }
};
function updateUsageText() {
  const el = $('aiUsage');
  if (!el) return;
  el.textContent = '本次已用 ' + AI_USAGE.session + ' tokens · 累计 ' + AI_USAGE.total + ' tokens';
}
function aiCacheAll() {
  try { return JSON.parse(LS.get('ce.aicache', '{}')) || {}; } catch (e) { return {}; }
}
function aiCacheKey(kind, code, extra) {
  return kind + '|' + AI.model() + '|t' + AI.think() + '|p' + PROMPT_VER + '|' + hash32(code + '\u0000' + (extra || ''));
}
function aiCacheGet(kind, code, extra) {
  const all = aiCacheAll();
  return all[aiCacheKey(kind, code, extra)] || '';
}
function aiCacheSet(kind, code, extra, text) {
  const all = aiCacheAll();
  all[aiCacheKey(kind, code, extra)] = text;
  const keys = Object.keys(all);
  while (keys.length > 24) delete all[keys.shift()];
  LS.set('ce.aicache', JSON.stringify(all));
}

class AIError extends Error {}

async function aiErrorText(resp) {
  let detail = '';
  try {
    const j = await resp.json();
    detail = (j && j.error && (j.error.message || j.error.code)) || '';
  } catch (e) {}
  const map = {
    400: '请求有问题（可能是代码太长或格式不对）',
    401: 'Key 无效或已被撤销',
    402: '余额不足',
    403: '没有权限',
    404: '接口地址不对',
    422: '请求参数不对',
    429: '太频繁了，等一下再试',
    500: '服务器出错了',
    503: '服务器忙'
  };
  const base = map[resp.status] || ('请求失败 ' + resp.status);
  return base + (detail ? '：' + detail : '');
}

async function readSSE(resp, onDelta, onReason) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', out = '', rea = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of chunk.split('\n')) {
        if (line.slice(0, 5) !== 'data:') continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let j;
        try { j = JSON.parse(payload); } catch (e) { continue; }
        if (j.usage) AI_USAGE.add(j.usage);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        // 思考内容只用来提示「正在想」，不进正文
        if (d && d.reasoning_content) {
          rea += d.reasoning_content;
          if (onReason) onReason(rea);
        }
        if (d && d.content) {
          out += d.content;
          if (onDelta) onDelta(out);
        }
      }
    }
  }
  return out;
}

async function aiChat(opts) {
  const key = AI.key();
  if (!key) throw new AIError('还没填 API Key：右上「⋯」→ 设置 / AI 通道');
  const think = opts.think === undefined ? AI.think() : opts.think;
  const body = {
    model: opts.model || AI.model(),
    messages: opts.messages,
    max_tokens: opts.maxTokens || 800,
    stream: !!opts.stream
  };
  if (opts.json) body.response_format = { type: 'json_object' };
  if (opts.stream) body.stream_options = { include_usage: true };
  // 官方文档（思考模式）：thinking 默认开、effort 默认 high；
  // 思考模式下 temperature/presence_penalty/frequency_penalty 不生效，传了只是噪音，所以不传。
  if (think !== 'off') {
    body.thinking = { type: 'enabled' };
    body.reasoning_effort = think === 'rage' ? 'high' : think;
  } else {
    body.thinking = { type: 'disabled' };
    body.temperature = opts.temperature === undefined ? 0.6 : opts.temperature;
  }
  let resp;
  try {
    resp = await fetch(AI.base() + '/chat/completions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
      signal: opts.signal
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new AIError('网络不通，先看看 Wi-Fi；离线解释照旧能用');
  }
  if (!resp.ok) throw new AIError(await aiErrorText(resp));
  if (!opts.stream) {
    const j = await resp.json();
    if (j.usage) AI_USAGE.add(j.usage);
    const m = j.choices && j.choices[0] && j.choices[0].message;
    return (m && m.content) || '';
  }
  return readSSE(resp, opts.onDelta, opts.onReason);
}

function stopAI() {
  if (aiRun) {
    try { aiRun.abort(); } catch (e) {}
    aiRun = null;
  }
}
function newAbort() {
  stopAI();
  const c = new AbortController();
  aiRun = c;
  return c;
}

async function runOverallAI() {
  if (!AI.ready()) { openSettings(); return; }
  const code = $('code').value.trim();
  if (!code) { toast('先粘代码'); setView('code'); return; }
  ensureAiOverall();
  const out = $('aiOut');

  const runBtn = $('aiRun');
  const cached = aiCacheGet('overall', code, '');
  $('aiStop').hidden = true;

  }
  const ctrl = newAbort();
  runBtn.disabled = true;
  $('aiStop').hidden = false;
  const rage0 = AI.think() === 'rage';
  note.textContent = rage0 ? '狂暴模式：准备中（顶配模型 + 强思考，比普通档贵好几倍）…' : '正在生成…';
  note.classList.remove('ai-err');
  out.textContent = '';
  out.innerHTML = '<span class="ai-cursor">●</span>';
  // 思考档位下正文会晚到一大截，用计时告诉人它没死
  const t0 = Date.now();
  let thinkTimer = null;
  const stopThinkClock = () => { if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; } };
  const startThinkClock = () => {
    if (thinkTimer) return;
    const tick = () => {
      const s = Math.floor((Date.now() - t0) / 1000);
      note.textContent = s >= 45
        ? '这段有点绕，还在想；等不及可以点停止'
        : '正在想…（0:' + (s < 10 ? '0' + s : String(s)) + '）';
    };
    tick();
    thinkTimer = setInterval(tick, 1000);
  };
  const tier = AI.think();
  const rage = tier === 'rage';
  const rageModel = 'deepseek-v4-pro';
  const baseUser = '语言：' + langLabel(currentLang(code)) + '\n代码：\n```\n' + code + '\n```\n';
  let text = '';
  try {
    let outline = '';
    if (rage) {
      // 第一轮只拆结构：算法、复杂度、关键步骤、坑。第二轮拿着它写讲解，比一次憋出来稳。
      note.textContent = '狂暴模式（' + rageModel + ' + 强思考 · 第 1/2 轮）：先拆结构和坑…';
      outline = await aiChat({
        think: 'rage',
        model: rageModel,
        json: true,
        maxTokens: 800,
        signal: ctrl.signal,
        messages: [
          { role: 'system', content: '你是懂算法和代码审阅的人。只输出一个 JSON 对象，不要别的文字。' },
          { role: 'user', content: baseUser + '先别写讲解，只把这个对象填出来：{"algorithm":"这段像什么算法，看不出来就写 无","complexity":"时间复杂度估计","structure":["按执行顺序的关键步骤，3 到 6 条"],"pitfalls":["最容易踩的坑，1 到 4 条"]}' }
        ]
      });
      note.textContent = '狂暴模式（第 2/2 轮）：写讲解…';
    }
    text = await aiChat({
      stream: true,
      think: tier,
      model: rage ? rageModel : undefined,
      maxTokens: rage ? 2000 : 1400,
      signal: ctrl.signal,
      messages: [
        { role: 'system', content: sysBase() },
        { role: 'user', content: baseUser +
          (outline ? '先看一遍刚才拆出来的结构（JSON）：\n' + outline + '\n\n' : '') +
          '先用一句话说清这段代码想干什么。然后按它执行的顺序讲关键几步，讲到哪一行就提哪一行（写成「第 3 行」，不要编行号）。最后说这段代码最容易踩的坑，或者新手最容易看错的地方。250 到 500 字，像当面讲。不要列提纲，不要「首先其次最后」，不要空话。' }
      ],
      onReason: startThinkClock,
      onDelta: all => {
        stopThinkClock();
        note.textContent = rage ? '狂暴模式 · 这一段用的是 ' + rageModel + '（比普通档贵）' : '';
        out.textContent = all;
      }
    });
    out.textContent = text || '（模型这次没返回内容，点「重新生成」再试一次）';
    if (text) aiCacheSet('overall', code, '', text);
    note.textContent = '';
    runBtn.textContent = '重新生成';
  } catch (e) {
    if (e && e.name === 'AbortError') {
      out.textContent = (text || '') + '\n\n（已停止）';
      note.textContent = '已停止，已经出来的部分留着。';
    } else {
      out.textContent = text || '';
      note.textContent = (e && e.message) || '出错了';
      note.classList.add('ai-err');
    }
  } finally {
    stopThinkClock();
    aiRun = null;
    runBtn.disabled = false;
    $('aiStop').hidden = true;
  }
}

/* 2) 逐行 AI 补全 */
function missingLines(res) {
  const out = [];
  res.lineTexts.forEach((t, i) => {
    if (!t.trim()) return;
    const n = res.lineNotes[i];
    if (!n || n.fallback || !n.note) out.push(i + 1);
  });
  return out;
}
function stripFence(s) {
  let t = String(s || '').trim();
  if (t.startsWith('```')) t = t.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '');
  return t.trim();
}
async function runLinesAI() {
  if (!AI.ready()) { openSettings(); return; }
  const res = lastResult;
  if (!res) { toast('先点「解释」'); return; }
  const code = $('code').value.trim();
  const todo = missingLines(res);
  if (!todo.length) { toast('每一行都已经有说明了'); return; }
  const cacheKeyExtra = todo.join(',');
  const btn = $('btnAiLines');
  const cached = aiCacheGet('lines', code, cacheKeyExtra);
  if (cached) { applyAiLines(cached, res); toast('读到缓存，没花钱'); return; }
  btn.disabled = true;
  btn.textContent = 'AI 补全中…';
  try {
    const list = todo.map(n => n + ': ' + res.lineTexts[n - 1]).join('\n');
    const text = await aiChat({
      json: true,
      think: 'off',
      maxTokens: Math.min(2000, 200 + todo.length * 40),
      messages: [
        { role: 'system', content: sysBase() + '这次必须只输出一个 JSON 对象，形如 {"lines":[{"line":3,"note":"给变量 x 赋初值"}]}，不许有别的文字。' },
        { role: 'user', content: '语言：' + langLabel(res.lang) + '\n下面是需要解释的行（行号: 代码）：\n' + list + '\n请给每一行一条不超过 30 个汉字的中文说明，只解释这一行在做什么。像给人划重点，别用「初始化」这种词硬套。' }
      ]
    });
    applyAiLines(text, res);
    aiCacheSet('lines', code, cacheKeyExtra, text);
  } catch (e) {
    toast((e && e.message) || 'AI 补全失败', 3200);
  } finally {
    btn.disabled = false;
    btn.textContent = 'AI 补全没讲的行';
  }
}
function applyAiLines(text, res) {
  let data = null;
  try { data = JSON.parse(stripFence(text)); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.lines)) { toast('AI 返回的格式没看懂，再点一次试试', 3000); return; }
  let n = 0;
  data.lines.forEach(item => {
    const ln = parseInt(item.line, 10);
    const note = String(item.note || '').trim();
    if (!ln || !note || ln < 1 || ln > res.lineNotes.length) return;
    res.lineNotes[ln - 1] = { note: note, tag: 'ai' };
    n++;
  });
  renderLines(res);
  toast('AI 补了 ' + n + ' 行');
}

const FILE_EXT = /\.(txt|c|cpp|cc|cxx|h|hpp|py|js|mjs|ts|jsx|tsx|java|kt|go|rs|sql|html|css|md|json|xml|yml|yaml|sh|bat|ps1)$/i;
const FS_STATE = { uri: '', name: '', sub: '' };

const FS = {
  _p: null,
  plugin() {
    if (this._p) return this._p;
    if (!nativePlatform || !window.Capacitor) return null;
    const C = window.Capacitor;
    this._p = (C.Plugins && C.Plugins.FolderSource) ||
      (typeof C.registerPlugin === 'function' ? C.registerPlugin('FolderSource') : null);
    return this._p || null;
  },
  async call(method, opts) {
    if (!nativePlatform) throw new Error('这个功能只在装了的 App 里能用；网页版读不了手机文件夹');
    const p = this.plugin();
    if (!p || typeof p[method] !== 'function') throw new Error('这个版本的 App 还没带文件夹功能，先更新');
    return p[method](opts || {});
  }
};

function fmtSize(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function renderFsList(items) {
  const host = $('fsList');
  const list = (items || []).filter(it => it && (it.isDir || FILE_EXT.test(it.name)));
  list.sort((a, b) => (b.isDir ? 1 : 0) - (a.isDir ? 1 : 0) || String(a.name).localeCompare(String(b.name)));
  if (!list.length) {
    host.innerHTML = '<div class="empty">这个文件夹里没找到代码文件</div>';
    return;
  }
  host.innerHTML = list.map(it =>
    '<div class="fs-item" data-uri="' + escapeHtml(it.uri || '') + '" data-dir="' + (it.isDir ? '1' : '0') +
    '" data-name="' + escapeHtml(it.name || '') + '" data-sub="' + escapeHtml(it.sub || '') + '">' +
    '<span class="nm">' + (it.isDir ? '目录 · ' : '') + escapeHtml(it.name || '') + '</span>' +
    '<span class="meta">' + (it.isDir ? '' : fmtSize(it.size)) + '</span></div>'
  ).join('');
}

const HIST = {
  all() {
    try { const a = JSON.parse(LS.get('ce.hist', '[]')); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  },
  save(arr) { LS.set('ce.hist', JSON.stringify(arr)); },
  clear() { LS.del('ce.hist'); }
};

// 网页版：存代码本身，按字节封顶（内容不在 App 里囤的是 APK 那条路）
function histRecordCode(code, lang) {
  if (nativePlatform) return;
  const body = String(code || '');
  if (!body.trim()) return;
  const h = hash32(body);
  const arr = HIST.all().filter(x => x.h !== h);
  const firstLine = body.split('\n').find(l => l.trim()) || '';
  arr.unshift({
    h,
    code: body.length > 20000 ? body.slice(0, 20000) : body,
    preview: firstLine.trim().slice(0, 60),
    lines: body.split('\n').length,
    lang: lang || '',
    at: Date.now()
  });
  arr.sort((a, b) => (b.at || 0) - (a.at || 0));
  const MAX_BYTES = 1200 * 1024;
  const keep = [];
  let total = 0;
  for (const it of arr) {
    const sz = (it.code || '').length;
    if (keep.length >= 200 || total + sz > MAX_BYTES) continue;
    keep.push(it);
    total += sz;
  }
  HIST.save(keep);
}

// APK：只记「打开过哪个文件」，代码本身还在用户自己的文件夹里
function histRecordFile(item) {
  if (!nativePlatform) return;
  const arr = HIST.all().filter(x => x.uri !== item.uri);
  arr.unshift({ uri: item.uri, name: item.name, sub: item.sub || '', at: Date.now() });
  HIST.save(arr.slice(0, 20));
}

function pad2(n) { return n < 10 ? '0' + n : String(n); }

function renderHist() {
  const host = $('histList');
  const arr = HIST.all();
  $('histHint').textContent = nativePlatform
    ? '只记打开过哪些文件，代码还在你自己的文件夹里，App 不囤。'
    : '只存在这台设备上；最多 1.2MB 或 200 段，超了从最旧的丢。';
  if (!arr.length) {
    host.innerHTML = '<div class="empty">还没有记录。</div>';
    return;
  }
  host.innerHTML = arr.map((it, i) => {
    const d = new Date(it.at || 0);
    const stamp = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    const title = nativePlatform ? (it.name || '（文件）') : (it.preview || '（空）');
    const meta = nativePlatform ? stamp : ((it.lines || 0) + ' 行');
    return '<div class="fs-item" data-hist="' + i + '">' +
      '<span class="nm">' + escapeHtml(title) + '</span>' +
      '<span class="meta">' + escapeHtml(meta) + '</span></div>';
  }).join('');
}

async function readClipboard() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const t = await navigator.clipboard.readText();
      if (t) return t;
    }
  } catch (e) {}
  try {
    const C = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard;
    if (C && C.read) {
      const r = await C.read();
      if (r && r.value) return r.value;
    }
  } catch (e) {}
  return '';
}
async function pasteIntoCode() {
  const t = await readClipboard();
  const codeEl = $('code');
  if (!t) {
    codeEl.focus();

  saveCode();
  syncGutter();
  doExplain();
  toast('已粘贴 ' + t.split('\n').length + ' 行');
}
async function copyText(t) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); return true; }
  } catch (e) {}
  try {
    const C = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard;
    if (C && C.write) { await C.write({ string: t }); return true; }
  } catch (e) {}
  return false;
}

/* ================= 更新检查 =================
   更新源是 Pages 上的 version.json（CI 每次出包重新生成）。
   sw.js 对非导航请求是缓存优先，所以请求要带时间戳、并且 sw 里给这个路径单独放行。 */
const FEED_URL = nativePlatform
  // APK 里的页面来自 https://localhost，相对路径会 404，必须打线上；
  // GitHub Pages 回 access-control-allow-origin: *（实测），跨域读得到

const APP_HOME = 'https://l3j3y3.github.io/code-explainer/';
const FEED_TTL = 12 * 3600 * 1000;
let feedMem = null;

function cmpVersion(a, b) {
  const pa = String(a || '').split('.').map(x => parseInt(x, 10) || 0);
  const pb = String(b || '').split('.').map(x => parseInt(x, 10) || 0);
  const n = Math.max(pa.length, pb.length);
  for (let i = 0; i < n; i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x < y ? -1 : 1;

  return 0;

}

async function getFeed(force) {
  if (window.__ceFeed) return window.__ceFeed;      // 测试注入点
  if (!force && feedMem) return feedMem;
  const cached = readCachedFeed();
  if (!force && cached && cached.__t && Date.now() - cached.__t < FEED_TTL) { feedMem = cached; return cached; }
  try {
    const r = await fetch(FEED_URL + '?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    if (!data || !data.version) throw new Error('bad feed');
    data.__t = Date.now();
    feedMem = data;
    LS.set('ce.feed', JSON.stringify(data));
    return data;
  } catch (e) {
    return feedMem || cached;
  }
}

function feedIsNewer(feed) {
  return !!(feed && feed.version && cmpVersion(feed.version, APP_VERSION) > 0);
}

function syncUpdateMenu(feed) {
  const el = $('miUpdate');
  if (!el) return;
  if (feedIsNewer(feed)) {
    el.textContent = '更新到 ' + feed.version + '（构建 ' + (feed.build || '?') + '）';
    el.classList.add('new');
  } else {
    el.textContent = '检查更新';
    el.classList.remove('new');
  }
}

async function checkUpdate(quiet) {
  const feed = await getFeed(true);
  syncUpdateMenu(feed);
  if (!feed) {
    if (!quiet) toast('检查失败：离线或接口不通', 3000);
    return null;
  }
  if (feedIsNewer(feed)) {
    if (quiet) toast('有新版本 ' + feed.version + '，点 ⋯ 里的「更新到 ' + feed.version + '」', 3800);
    return feed;
  }
  if (!quiet) toast('已是最新 ' + APP_VERSION + (feed.build ? '（构建 ' + feed.build + '）' : ''), 3000);
  return null;
}

function applyUpdate(feed) {
  if (!feed) return;
  if (nativePlatform) {
    // 跨域链接会被 Capacitor 的 launchIntent 交给系统浏览器，浏览器再走 APK 下载
    const url = new URL(feed.apk || 'apk/code-explainer.apk', APP_HOME).href;
    openExternal(url);
    toast('在浏览器里下载新版 APK，装完覆盖即可，设置不丢', 3600);
    return;
  }
  const reg = (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
    ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
  Promise.resolve(reg)
    .then(r => (r && r.update ? r.update().catch(() => {}) : null))
    .catch(() => {})
    .then(() => setTimeout(() => location.reload(), 450));
}

function openExternal(url) {
  // Capacitor 里 window.open 会被吞（没开多窗口），得靠同窗口点 <a> 触发 shouldOverrideUrlLoading
  if (nativePlatform || /^mailto:/i.test(url)) {
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  window.open(url, '_blank', 'noopener');
}

/* ================= 反馈 =================
   不自动上传：拼好一段文本，用户自己选「复制 / 邮件 / GitHub」。
   默认只带版本、平台、识别语言；代码要手动勾，避免把代码顺手公开出去。 */
const FEEDBACK_MAIL = 'liujiayejiaye@163.com';
const FEEDBACK_REPO = 'l3j3y3/code-explainer';
const FB_CODE_LINES = 30;
const FB_URL_LIMIT = 5500;      // encodeURIComponent 之后的长度上限
let fbKind = '识别错了';

function fbLangText() {
  if (!lastResult) return '（还没解释）';
  const how = lastResult.autoLang ? (lastResult.confident ? '自动识别' : '自动识别，不确定') : '手动指定';
  let t = langLabel(lastResult.lang) + '（' + how + '）';
  if (lastResult.candidates && lastResult.candidates.length > 1) {
    t += '，候选 ' + lastResult.candidates.slice(0, 3).map(c => c.label + ' ' + c.score).join(' · ');
  }
  return t;
}

function fbPageText() {
  return currentView === 'code' ? '代码' : currentView === 'lines' ? '逐行' : currentView === 'words' ? '词表' : '整体';
}

function buildFeedbackText(opts) {
  const o = opts || {};
  const kind = o.kind || fbKind;
  const body = String(o.text === undefined ? '' : o.text).trim() || '（没写正文）';
  const withCode = o.withCode === undefined ? false : !!o.withCode;
  const lines = [];
  lines.push('### 反馈：' + kind);
  lines.push(body);
  lines.push('');
  lines.push('---');
  lines.push('版本：' + APP_VERSION + ' · ' + (nativePlatform ? 'app（Android WebView）' : 'pwa'));
  lines.push('识别语言：' + fbLangText());
  lines.push('页面：' + (o.page || fbPageText()));
  lines.push('时间：' + new Date().toISOString());
  if (withCode) {
    const code = o.code === undefined ? $('code').value : String(o.code || '');
    const arr = code.split('\n').slice(0, FB_CODE_LINES);
    if (code.trim()) {
      const fence = '```' + (lastResult && lastResult.lang && lastResult.lang !== 'plain' ? lastResult.lang : '');
      lines.push('');
      lines.push('代码（前 ' + arr.length + ' 行' + (code.split('\n').length > FB_CODE_LINES ? '，已截断' : '') + '）：');
      lines.push(fence);
      lines.push(arr.join('\n'));
      lines.push('```');
    }
  }
  return lines.join('\n');
}

function clipForUrl(text, limit) {
  const note = '\n\n（内容过长已截断，完整内容请用「复制反馈内容」）';
  let s = String(text || '');
  if (encodeURIComponent(s).length <= limit) return s;
  const budget = limit - encodeURIComponent(note).length;
  while (s.length > 60 && encodeURIComponent(s).length > budget) {
    s = s.slice(0, Math.floor(s.length * 0.85));
  }
  return s + note;
}

function mailtoUrl(text) {
  return 'mailto:' + FEEDBACK_MAIL +
    '?subject=' + encodeURIComponent('代码解释器反馈：' + fbKind) +
    '&body=' + encodeURIComponent(clipForUrl(text, FB_URL_LIMIT));
}

function issueUrl(text) {
  return 'https://github.com/' + FEEDBACK_REPO + '/issues/new' +
    '?title=' + encodeURIComponent('反馈：' + fbKind) +
    '&body=' + encodeURIComponent(clipForUrl(text, FB_URL_LIMIT)) +
    '&labels=' + encodeURIComponent('feedback');
}

/* ---------- 键盘 / 视口 ---------- */
function fitViewport() {
  if (!window.visualViewport) return;
  document.documentElement.style.setProperty('--vvh', Math.round(window.visualViewport.height) + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
  fitViewport();
}

/* ---------- 原生壳 ---------- */
if (nativePlatform) {
  const P = window.Capacitor.Plugins || {};
  if (P.App && P.App.addListener) {
    P.App.addListener('backButton', () => {
      if (currentView !== 'code') setView('code');
      else if (P.App.exitApp) P.App.exitApp();
    });
  }
  if (P.StatusBar) {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      P.StatusBar.setStyle({ style: dark ? 'DARK' : 'LIGHT' });
      P.StatusBar.setBackgroundColor({ color: dark ? '#161b22' : '#ffffff' });
    } catch (e) {}
  }
}

/* ---------- 启动 ---------- */
const APP_VERSION = '1.4.0';
// 安全区由 CSS 变量 --safe-area-* 统一消费：浏览器里是 env() 兜底，
// Android 壳里由 MainActivity 把系统栏尺寸写进行内样式（见那边注释）。
// 这个 class 只留给诊断/样式钩子用，不再靠它压掉内边距。

/* 桌面/主屏快捷方式：?paste=1 进来就直接读剪贴板 */
if (/[?&]paste=1(&|$)/.test(location.search)) {
  try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  setTimeout(pasteIntoCode, 260);
}

/* Service Worker：原生壳里跳过（资源在 APK 里，走 SW 反而会卡住旧版本） */
if (!nativePlatform && 'serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}
