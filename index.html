<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代码解释器">
<title>代码解释器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e3e6ea; --accent: #2563eb; --accent-soft: #e8f0fe;
    --warn: #b45309; --warn-soft: #fef3c7;
    --code-bg: #1e1e1e; --code-text: #d4d4d4;
    --kw: #569cd6; --bi: #dcdcaa; --ty: #4ec9b0; --str: #ce9178;
    --com: #6a9955; --num: #b5cea8; --op: #d4d4d4; --tag: #569cd6; --attr: #9cdcfe;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --mono: Consolas, "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
    /* 安全区内边距统一走变量：浏览器/PWA 落到 env() 兜底，
       Android 壳由 MainActivity 把 systemBars|displayCutout 写进行内样式覆盖它
       （WebView 的 env() 只报挖孔、不报系统栏，单靠 env() 是拿不到状态栏高度的） */
    --safe-area-top: env(safe-area-inset-top, 0px);
    --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-left: env(safe-area-inset-left, 0px);
    --safe-area-right: env(safe-area-inset-right, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #58a6ff; --accent-soft: #1f2d3d;
      --code-bg: #0d1117; --code-text: #d4d4d4; --shadow: 0 1px 3px rgba(0,0,0,.4);
      --warn: #f0b429; --warn-soft: #3a2f13;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ============ 外壳 ============ */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; height: var(--vvh, 100dvh); overflow: hidden; }

  .appbar {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px;
    padding: calc(6px + var(--safe-area-top)) calc(12px + var(--safe-area-right)) 6px calc(12px + var(--safe-area-left));
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: relative; z-index: 6;
  }
  .appbar .bar-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .appbar .bar-lang { gap: 6px; }
  .appbar .bar-lang select.chip { flex: 1 1 auto; max-width: none; min-width: 0; }
  .appbar .title {
    font-size: 16px; font-weight: 700; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .appbar .spacer { flex: 1 1 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px;
    border-radius: 17px; border: 1px solid var(--border); background: var(--panel);
    font-size: 13px; white-space: nowrap;
  }
  select.chip {
    appearance: none; -webkit-appearance: none; padding-right: 26px; max-width: 128px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 15px, calc(100% - 9px) 15px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .chip.ai { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.ai.off { border-color: var(--border); color: var(--muted); font-weight: 400; }
  .chip.guess {
    flex: 0 0 auto; max-width: 58%; height: 34px; font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;
    line-height: 32px; color: var(--muted);
  }
  .chip.guess.unsure { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); font-weight: 600; }
  .icon-btn {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); display: inline-flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1; padding: 0;
  }

  /* ============ 视图区 ============ */
  .views { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; min-width: 0; }
  .view.active { display: flex; }
  #results { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  #results.active { display: flex; }
  #results .view { position: absolute; inset: 0; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 12px; }

  /* ============ 代码屏 ============ */
  .editor-wrap { flex: 1 1 auto; display: flex; min-height: 0; background: var(--code-bg); }
  .gutter {
    flex: 0 0 auto; width: 44px; overflow: hidden; padding: 12px 8px 12px 4px;
    text-align: right; color: #6e7681; font-family: var(--mono); font-size: 14px;
    line-height: 1.6; white-space: pre; user-select: none;
    border-right: 1px solid rgba(255,255,255,.08);
  }
  #code {
    flex: 1 1 auto; min-width: 0; border: 0; outline: 0; resize: none;
    background: var(--code-bg); color: var(--code-text);
    font-family: var(--mono); font-size: 14px; line-height: 1.6;
    padding: 12px; tab-size: 4; white-space: pre; overflow: auto;
  }
  #code::placeholder { color: #6e7681; }
  .cta {
    flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .cta .btn { height: 46px; border-radius: 12px; font-size: 15px; }
  .cta .btn.primary { flex: 1 1 auto; }

  /* ============ 底部导航 ============ */
  .tabbar {
    flex: 0 0 auto; display: flex; background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-area-bottom); position: relative; z-index: 6;
  }
  .tabbar button {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 0 5px; border: 0; background: transparent; color: var(--muted); font-size: 11px;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ============ 通用按钮 ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); font-size: 14px;
  }
  .btn:active { filter: brightness(.95); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.small { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .5; }

  /* ============ 结果内容 ============ */
  .filters {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center; overflow-x: auto;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .filters button {
    height: 32px; padding: 0 12px; border-radius: 16px; white-space: nowrap;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px;
  }
  .filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filters button .cnt { margin-left: 5px; font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }

  .summary-card { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 14.5px; }
  .summary-card b { color: var(--accent); }
  h3.sec { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 8px; letter-spacing: .5px; }
  ul.steps { margin: 0; padding-left: 22px; }
  ul.steps li { margin: 4px 0; }
  .func-list { display: flex; flex-direction: column; gap: 6px; }
  .func-item {
    display: flex; gap: 8px; align-items: baseline; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .func-item .ln { color: var(--muted); font-size: 12px; min-width: 52px; flex: 0 0 auto; }
  .func-item code { font-family: var(--mono); color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: 14px; }

  /* 逐行：按结构块聚合的卡片（一行一张卡会把说明切碎，看着不连贯） */
  .ln-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; background: var(--panel); }
  .ln-block-head {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 10px;
    background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600;
  }
  .ln-block-head .rng { font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .ln-block-head .nm { font-family: var(--mono); font-weight: 700; word-break: break-all; }
  .ln-gap { display: flex; align-items: center; gap: 8px; margin: 8px 2px; color: var(--muted); font-size: 11.5px; }
  .ln-gap::before, .ln-gap::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--border); }
  .ln-item { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px 7px; border-top: 1px solid var(--border); }
  .ln-block-head + .ln-src + .ln-item { border-top: 0; }
  .ln-item.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ln-item .ln-no {
    flex: 0 0 auto; width: 30px; text-align: right; color: var(--muted);
    font-size: 11.5px; font-variant-numeric: tabular-nums; user-select: none;
  }
  .ln-code {
    display: flex; background: var(--code-bg); color: var(--code-text);
    font-family: var(--mono); font-size: 13px; line-height: 1.7; overflow-x: auto; white-space: pre;
  }
  .ln-code .lineno {
    flex: 0 0 auto; width: 40px; text-align: right; padding: 5px 8px 5px 6px;
    color: #6e7681; user-select: none; border-right: 1px solid #333;
  }
  .ln-code .code-body { padding: 5px 10px; }
  .ln-item.compact .ln-note { color: #8c959f; }
  /* 块内整块源码：先把整块原文铺一遍，再看逐行解释；点解释行会高亮对应源码行 */
  .ln-src {
    background: var(--code-bg); color: var(--code-text);
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    overflow-x: auto; overflow-y: auto; max-height: 52vh;
    white-space: pre; border-bottom: 1px solid var(--border);
  }
  .src-line { display: flex; min-width: max-content; }
  .src-line .lineno {
    flex: 0 0 auto; width: 38px; text-align: right; padding: 0 8px 0 6px;
    color: #6e7681; user-select: none; border-right: 1px solid #333;
  }
  .src-line .code-body { padding: 0 10px; }
  .src-line.hl { background: rgba(88,166,255,.22); }
  .ln-block-head { cursor: pointer; }
  .ln-block-head .fold { margin-left: auto; font-size: 11.5px; font-weight: 500; opacity: .85; }
  .ln-block.folded .ln-src, .ln-block.folded .ln-item { display: none; }
  .ln-note { display: flex; gap: 8px; align-items: baseline; flex: 1 1 auto; font-size: 13.5px; }
  /* 纠错问题带 */
  .lint-bar { border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12.5px; }
  .lint-bar.ok .lint-head { color: var(--muted); }
  .lint-head { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .lint-item {
    display: flex; gap: 8px; align-items: baseline; padding: 6px 12px;
    border-top: 1px solid var(--border); cursor: pointer;
  }
  .lint-item .ln { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lint-item .msg { flex: 1 1 auto; }
  .lint-item .hint { flex: 1 1 100%; color: var(--muted); font-size: 11.5px; }
  .lint-item.error .msg { color: #b42318; font-weight: 600; }
  .lint-item.warn .msg { color: var(--warn); }
  .lint-bar .lint-list { display: none; max-height: 40vh; overflow-y: auto; }
  .lint-bar.open .lint-list { display: block; }
  /* 算法类型卡 */
  .algo-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
  .algo-card .algo-name { font-size: 15px; font-weight: 700; color: var(--accent); }
  .algo-why { margin: 6px 0 0; padding-left: 18px; color: var(--text); font-size: 13px; }
  .algo-why li { margin: 2px 0; }
  /* 文件夹 / 历史列表 */
  .fs-list { max-height: 46vh; overflow-y: auto; margin: 4px 0 10px; }
  .fs-item {
    display: flex; gap: 10px; align-items: baseline; padding: 9px 10px;
    border: 1px solid var(--border); border-radius: 9px; margin-bottom: 6px; background: var(--panel);
  }
  .fs-item:active { background: var(--accent-soft); }
  .fs-item .nm { flex: 1 1 auto; word-break: break-all; font-size: 13.5px; }
  .fs-item .meta { flex: 0 0 auto; color: var(--muted); font-size: 11.5px; }
  .ln-note .tag {
    flex: 0 0 auto; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .ln-note.ai .tag { background: #dafbe1; color: #1a7f37; }
  .note .fallback, .ln-note .fallback { color: var(--muted); }

  .tok-k, .tok-kw { color: var(--kw); } .tok-bi { color: var(--bi); } .tok-ty { color: var(--ty); }
  .tok-str { color: var(--str); } .tok-com { color: var(--com); font-style: italic; }
  .tok-num { color: var(--num); } .tok-op { color: var(--op); }
  .tok-tag { color: var(--tag); } .tok-attr, .tok-prop { color: var(--attr); }
  .tok-sel { color: var(--kw); } .tok-plain { color: var(--code-text); }

  .kw-list { display: flex; flex-direction: column; gap: 8px; }
  .kw-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--panel); }
  .kw-item:active { background: var(--accent-soft); }
  .kw-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kw-head code { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .kw-head .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .kw-head .zh { font-size: 14px; }
  .kw-head .cnt { font-size: 12px; color: var(--muted); margin-left: auto; }
  .kw-jump {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; margin: 2px 4px 2px 0;
    border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
    font-size: 12px; color: var(--accent); font-family: var(--mono);
  }
  .kw-body { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .kw-item.open .kw-body { display: block; }
  .kw-body p { margin: 4px 0; font-size: 13.5px; }
  .kw-body pre {
    background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 8px 10px;
    font-family: var(--mono); font-size: 12.5px; overflow-x: auto; margin: 6px 0; white-space: pre;
  }
  .kw-body a { color: var(--accent); font-size: 13px; }
  .kw-miss { color: var(--muted); font-size: 13px; }

  /* ============ AI ============ */
  .ai-block { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .ai-head b { font-size: 13px; color: var(--accent); }
  .ai-head .spacer { flex: 1; }
  .ai-out { padding: 10px 12px; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .ai-out:empty { display: none; }
  .ai-note { padding: 8px 12px; color: var(--muted); font-size: 13px; }
  .ai-err { color: #d1242f; }
  .ai-cursor { color: var(--accent); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .ai-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 10px; }
  .ai-chat { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 0; }
  .ai-msg { font-size: 14px; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .ai-msg.me { background: var(--accent-soft); align-self: flex-end; max-width: 88%; }
  .ai-msg.ai { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; max-width: 92%; }
  .ask-row { display: flex; gap: 8px; padding: 10px 12px 12px; }
  .ask-row input {
    flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); font-size: 14px;
  }

  /* ============ 抽屉 / 遮罩 ============ */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(14px + var(--safe-area-bottom));
    max-height: 86vh; overflow-y: auto; box-shadow: 0 -8px 28px rgba(0,0,0,.25);
  }
  .sheet h3 { margin: 0 0 8px; font-size: 15px; }
  .sheet .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field select {
    height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); font-size: 14px; width: 100%;
  }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; margin-bottom: 6px; }
  .switch-row span { font-size: 14px; }
  .switch-row input { width: 20px; height: 20px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions .btn { flex: 1 1 auto; }
  /* 语言候选列表 */
  .lang-item {
    display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left;
    padding: 10px 4px; border: 0; border-bottom: 1px solid var(--border); background: transparent;
  }
  .lang-item:last-child { border-bottom: 0; }
  .lang-item .li-top { display: flex; align-items: baseline; gap: 8px; }
  .lang-item .li-name { font-size: 15px; font-weight: 600; }
  .lang-item.current .li-name { color: var(--accent); }
  .lang-item .li-cur { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 0 5px; }
  .lang-item .li-score { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lang-item .li-bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .lang-item .li-bar i { display: block; height: 100%; background: var(--accent); }
  .lang-item .li-why { font-size: 12.5px; color: var(--muted); }
  .lang-sep { padding: 12px 4px 4px; font-size: 12px; color: var(--muted); }
  /* 反馈弹层 */
  .fb-kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .fb-kind {
    height: 30px; padding: 0 11px; border-radius: 15px; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .fb-kind.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #fbText {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); font-size: 14px; line-height: 1.6; resize: vertical; margin-bottom: 8px;
  }
  .menu-item.new { color: var(--accent); font-weight: 600; }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 13px 4px;
    border: 0; border-bottom: 1px solid var(--border); background: transparent; font-size: 15px;
  }
  .menu-item:last-child { border-bottom: 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + var(--safe-area-bottom)); transform: translateX(-50%);
    background: rgba(28,28,30,.94); color: #fff; font-size: 13px; padding: 8px 14px;
    border-radius: 18px; opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 40;
    max-width: 84vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ============ 桌面 ============ */
  .desktop-tabs { display: none; }
  @media (min-width: 900px) {
    .views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px; }
    #view-code {
      position: static; display: flex; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: var(--shadow); background: var(--panel);
    }
    #results {
      position: static; display: flex; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: var(--shadow); background: var(--panel);
    }
    #results .view { position: static; inset: auto; }
    .tabbar { display: none; }
    .cta { border-top: 1px solid var(--border); }
    .desktop-tabs {
      display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--border);
      background: var(--panel); flex: 0 0 auto;
    }
    .desktop-tabs button {
      height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent;
      border-radius: 0; background: transparent; color: var(--muted); font-size: 14px;
    }
    .desktop-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    #code { font-size: 13.5px; }
    .gutter { font-size: 13.5px; }
    .toast { bottom: 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="bar-row">
      <div class="title" id="barTitle">代码解释器</div>
      <div class="spacer"></div>
      <button id="btnAiChip" class="chip ai off" aria-label="AI 通道">AI</button>
      <button id="btnMore" class="icon-btn" aria-label="更多" aria-haspopup="menu">⋯</button>
    </div>
    <div class="bar-row bar-lang">
      <select id="lang" class="chip" aria-label="语言">
        <option value="auto">自动识别</option>
        <option value="python">Python</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="java">Java</option>
        <option value="js">JavaScript</option>
        <option value="sql">SQL</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="plain">纯文本</option>
      </select>
      <button id="btnLangGuess" class="chip guess" aria-label="识别结果与候选">识别：—</button>
    </div>
  </header>

  <main class="views">
    <section id="view-code" class="view active">
      <div class="editor-wrap">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"
          placeholder="把代码粘进来，然后点下面的「解释」"></textarea>
      </div>
      <div class="cta">
        <button id="btnPaste" class="btn">粘贴</button>
        <button id="btnExplain" class="btn primary">解释</button>
      </div>
    </section>

    <section id="results">
      <nav class="desktop-tabs" id="resultTabs">
        <button data-view="overall" class="active">整体</button>
        <button data-view="lines">逐行</button>
        <button data-view="words">词表</button>
      </nav>

      <section id="view-overall" class="view active">
        <div class="scroll" id="overallScroll">
          <div id="tab-overall"><div class="empty">点「解释」看这段代码在干什么。</div></div>
          <div id="aiOverall"></div>
        </div>
      </section>

      <section id="view-lines" class="view">
        <div class="filters">
          <button data-filter="all" class="active">全部</button>
          <button data-filter="noted">只看要点</button>
          <button id="btnAiLines" class="btn small">AI 补全没讲的行</button>
          <button id="btnLint" class="btn small">纠错</button>
        </div>
        <div class="lint-bar" id="lintBar" hidden></div>
        <div class="scroll" id="linesScroll"><div id="tab-lines"><div class="empty">还没解释。</div></div></div>
      </section>

      <section id="view-words" class="view">
        <div class="scroll" id="wordsScroll"><div id="tab-keywords"><div class="empty">还没解释。</div></div></div>
      </section>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="code" class="active" aria-label="代码">
      <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M15 7l5 5-5 5"/></svg>
      <span>代码</span>
    </button>
    <button data-view="overall" aria-label="整体">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span>整体</span>
    </button>
    <button data-view="lines" aria-label="逐行">
      <svg viewBox="0 0 24 24"><path d="M9 7h11"/><path d="M9 12h11"/><path d="M9 17h11"/><path d="M4 7h.01"/><path d="M4 12h.01"/><path d="M4 17h.01"/></svg>
      <span>逐行</span>
    </button>
    <button data-view="words" aria-label="词表">
      <svg viewBox="0 0 24 24"><path d="M20 12.5l-7.5 7.5L3 10.5V3h7.5z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
      <span>词表</span>
    </button>
  </nav>
</div>

<div class="mask" id="mask" hidden></div>

<div class="sheet" id="sheetMore" hidden>
  <button class="menu-item" id="miUpdate">检查更新</button>
  <button class="menu-item" id="miFiles">从文件夹读代码</button>
  <button class="menu-item" id="miHist">历史记录</button>
  <button class="menu-item" id="miPaste">粘贴剪贴板</button>
  <button class="menu-item" id="miCopy">复制代码</button>
  <button class="menu-item" id="miClear">清空代码</button>
  <button class="menu-item" id="miFeedback">反馈 / 提问题</button>
  <button class="menu-item" id="miSettings">设置 / AI 通道</button>
  <button class="menu-item" id="miAbout">关于</button>
</div>

<div class="sheet" id="sheetFiles" hidden>
  <h3>从文件夹读代码</h3>
  <p class="hint">软件只读这个文件夹，不往里写东西。点一个文件就载入并解释。</p>
  <p class="hint" id="fsPath">还没选文件夹</p>
  <div class="sheet-actions">
    <button class="btn" id="fsPick">选文件夹</button>
    <button class="btn" id="fsUp" hidden>上一层</button>
  </div>
  <div id="fsList" class="fs-list"></div>
  <div class="sheet-actions">
    <button class="btn primary" id="fsClose">关掉</button>
  </div>
</div>

<div class="sheet" id="sheetHist" hidden>
  <h3>历史记录</h3>
  <p class="hint" id="histHint">只存在这台设备上。</p>
  <div id="histList" class="fs-list"></div>
  <div class="sheet-actions">
    <button class="btn" id="histClear">清空记录</button>
    <button class="btn primary" id="histClose">关掉</button>
  </div>
</div>

<div class="sheet" id="sheetSettings" hidden>
  <h3>设置</h3>
  <label class="switch-row">
    <span>启用 AI 通道</span>
    <input type="checkbox" id="aiOn">
  </label>
  <p class="hint">开启后，代码会发送到 DeepSeek 的服务器做讲解。关掉就是纯离线解释，一个字都不上传。</p>
  <div class="field">
    <label>API Key（只存在这台设备上）</label>
    <input id="aiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>接口地址</label>
    <input id="aiBase" placeholder="https://api.deepseek.com" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>模型</label>
    <select id="aiModel">
      <option value="deepseek-flash">deepseek-flash（快、便宜）</option>
      <option value="deepseek-v4-pro">deepseek-v4-pro（讲得更细，更贵）</option>
    </select>
  </div>
  <div class="field">
    <label>讲得多细</label>
    <select id="aiThink">
      <option value="off">快（不思考，最省，默认）</option>
      <option value="low">细一点（多花约一半，多等 3 到 5 秒）</option>
      <option value="high">最细（多花两三倍，多等 5 到 10 秒）</option>
      <option value="rage">狂暴（顶配模型 + 强思考 + 两轮，多花 5 到 8 倍）</option>
    </select>
  </div>
  <p class="hint" id="aiUsage"></p>
  <div class="sheet-actions">
    <button class="btn" id="aiClear">清掉 Key</button>
    <button class="btn" id="aiClearCache">清 AI 缓存</button>
    <button class="btn primary" id="aiSave">保存</button>
  </div>
  <p class="hint" id="verText"></p>
</div>

<div class="sheet" id="sheetLang" hidden>
  <h3>这段代码像什么语言</h3>
  <p class="hint">按识别信号打分排的；点一条就按它解释，选完还能随时在顶上换回自动识别。</p>
  <div id="langList"></div>
</div>

<div class="sheet" id="sheetFeedback" hidden>
  <h3>反馈</h3>
  <p class="hint">哪一步出的问题？说清楚「你粘了什么、看到什么、本来想看到什么」，最好带上那条命令/那段代码。</p>
  <div class="fb-kinds" id="fbKinds">
    <button class="fb-kind active" data-kind="识别错了">识别错了</button>
    <button class="fb-kind" data-kind="解释不对">解释不对</button>
    <button class="fb-kind" data-kind="界面问题">界面问题</button>
    <button class="fb-kind" data-kind="想要的功能">想要的功能</button>
    <button class="fb-kind" data-kind="其他">其他</button>
  </div>
  <textarea id="fbText" rows="5" placeholder="比如：粘 `CREATE DATABASE demo;` 能被认成 SQL，但 `CREATE SCHEMA demo;` 又被认成 Python 了。"></textarea>
  <label class="switch-row">
    <span>附带当前代码（前 30 行）</span>
    <input type="checkbox" id="fbWithCode">
  </label>
  <p class="hint" id="fbDiag"></p>
  <div class="sheet-actions">
    <button class="btn primary" id="fbCopy">复制反馈内容</button>
    <button class="btn" id="fbMail">发邮件</button>
  </div>
  <div class="sheet-actions">
    <button class="btn" id="fbIssue" hidden>去 GitHub 提 issue</button>
    <button class="btn" id="fbClear">清空</button>
  </div>
  <p class="hint">反馈不会自动上传：复制、邮件、GitHub 都要你自己点出去。没装邮件 App 就用复制。</p>
</div>

<div class="toast" id="toast"></div>

    [/\bnew\s+Scanner\s*\(/, 5, '有 Scanner'],
    [/@Override\b/, 5, '有 @Override']
  ]},
  { id: 'js', tests: [
    [/^\s*(const|let|var)\s+[\w$]+\s*=/m, 4, '有 const/let/var 声明'],
    [/=>/, 4, '有箭头函数'],
    [/\bconsole\.(log|error|warn)\s*\(/, 6, '有 console.log'],
    [/\bfunction\s+\w*\s*\(/, 4, '有 function'],
    [/\b(document|window)\.\w+/, 4, '有 document/window'],
    [/\brequire\s*\(|\bmodule\.exports\b/, 5, '有 require/module.exports'],
    [/\bnew\s+Promise\b|\bawait\s+/, 3, '有 Promise/await']
  ]},
  { id: 'html', tests: [
    [/<!DOCTYPE\s+html/i, 10, '有 <!DOCTYPE html>'],
    [/<\/?(html|head|body|div|p|a|img|script|style|h1|ul|li|span|table|form|input)\b/i, 5, '有 HTML 标签'],
    [/<\/[a-zA-Z]/, 3, '有闭合标签'],
    [/\b(class|id|href|src)\s*=\s*"/, 3, '有标签属性']
  ]},

    [/[.#]?[\w-]+\s*\{[^}]*:[^};]+\}/, 5, '有 选择器{属性:值}'],

    [/@media\b/, 4, '有 @media'],

function detectLanguages(code) {
  const src = String(code || '');
  const candidates = [];
  DETECT_RULES.forEach(rule => {
    if (rule.veto && rule.veto.test(src)) return;
    let score = 0;
    const reasons = [];
    rule.tests.forEach(t => {
      if (t[0].test(src)) { score += t[1]; reasons.push(t[2]); }
    });
    if (score > 0) candidates.push({ id: rule.id, label: langLabel(rule.id), score, reasons });
  });
  candidates.sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
  const top = candidates[0] || null;
  const second = candidates[1] || null;
  // 领先够多才算认准；差一点点就把候选全摆出来让人挑
  const confident = !!top && top.score >= 4 && (!second || top.score - second.score >= 3);
  return { candidates, confident, best: top ? top.id : 'plain' };
}
function detectLanguage(code) { return detectLanguages(code).best; }

/* ================= 分词器 ================= */
function pushTok(lines, type, text) {
  const parts = String(text).split('\n');
  parts.forEach((p, idx) => {
    if (idx > 0) lines.push([]);
    if (p) lines[lines.length - 1].push([type, p]);
  });
}

function scanClike(src, cfg) {
  const lines = [[]];
  const kwSet = new Set(cfg.kw), biSet = new Set(cfg.bi), tySet = new Set(cfg.ty);
  const idStart = c => /[A-Za-z_$]/.test(c);
  const idChar = c => /[A-Za-z0-9_$]/.test(c);
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (cfg.block && src.startsWith(cfg.block[0], i)) {
      const end = src.indexOf(cfg.block[1], i + cfg.block[0].length);
      const stop = end === -1 ? n : end + cfg.block[1].length;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    const mstr = cfg.strings.find(s => s[2] && src.startsWith(s[0], i));
    if (mstr) {
      const end = src.indexOf(mstr[1], i + mstr[0].length);
      const stop = end === -1 ? n : end + mstr[1].length;
      pushTok(lines, 'str', src.slice(i, stop)); i = stop; continue;
    }
    const lc = cfg.lineComments.find(l => src.startsWith(l, i));
    if (lc) {
      let end = src.indexOf('\n', i);
      if (end === -1) end = n;
      pushTok(lines, 'com', src.slice(i, end)); i = end; continue;
    }
    const st = cfg.strings.find(s => !s[2] && src.startsWith(s[0], i));
    if (st) {
      let j = i + st[0].length;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src.startsWith(st[1], j)) { j += st[1].length; break; }
        if (src[j] === '\n') break;
        j++;
      }
      pushTok(lines, 'str', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c) || (c === '.' && /\d/.test(src[i + 1] || ''))) {
      let j = i;
      while (j < n && /[0-9A-Fa-fxX._]/.test(src[j])) j++;
      pushTok(lines, 'num', src.slice(i, j)); i = j; continue;
    }
    if (idStart(c)) {
      let j = i;
      while (j < n && idChar(src[j])) j++;
      const w = src.slice(i, j);
      const lw = w.toLowerCase();
      let t = 'plain';
      if (kwSet.has(w) || kwSet.has(lw)) t = 'kw';
      else if (biSet.has(w) || biSet.has(lw)) t = 'bi';
      else if (tySet.has(w) || tySet.has(lw)) t = 'ty';
      pushTok(lines, t, w); i = j; continue;
    }
    const op = opsSorted.find(o => src.startsWith(o, i));
    if (op) { pushTok(lines, 'op', op); i += op.length; continue; }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function scanSQL(src) {
  const cfg = LANGS.sql;
  const lines = [[]];
  // 词典里为了规则可读写了 'PRIMARY KEY' 这种短语，但分词是按单词查表，
  // 不拆开的话这些词永远匹配不上（CREATE 和 TABLE 都会变成普通文本）。
  const kwSet = new Set(cfg.kw.flatMap(k => k.split(/\s+/)).map(k => k.toLowerCase()));
  const biSet = new Set(cfg.bi.map(k => k.toLowerCase()));
  const tySet = new Set(cfg.ty.map(k => k.toLowerCase()));
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('--', i)) {
      let end = src.indexOf('\n', i);
      if (end === -1) end = n;
      pushTok(lines, 'com', src.slice(i, end)); i = end; continue;
    }
    if (src.startsWith('/*', i)) {
      const end = src.indexOf('*/', i + 2);
      const stop = end === -1 ? n : end + 2;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === "'" || c === '"') {
      let j = i + 1;
      while (j < n) {
        if (src[j] === c) { j++; break; }
        if (src[j] === '\n') break;
        j++;
      }
      pushTok(lines, 'str', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c)) {
      let j = i; while (j < n && /[0-9.]/.test(src[j])) j++;
      pushTok(lines, 'num', src.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j), lw = w.toLowerCase();
      let t = 'plain';
      if (kwSet.has(lw)) t = 'kw';
      else if (biSet.has(lw)) t = 'bi';
      else if (tySet.has(lw)) t = 'ty';
      pushTok(lines, t, w); i = j; continue;
    }
    const op = opsSorted.find(o => src.startsWith(o, i));
    if (op) { pushTok(lines, 'op', op); i += op.length; continue; }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function scanHTML(src) {
  const lines = [[]];
  const tags = new Set(Object.keys(DICT.web));
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('<!--', i)) {
      const end = src.indexOf('-->', i);
      const stop = end === -1 ? n : end + 3;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === '<') {
      const end = src.indexOf('>', i);
      const stop = end === -1 ? n : end + 1;
      const tagText = src.slice(i, stop);
      const m = tagText.match(/^<(\/?)\s*([a-zA-Z0-9-]+)/);
      if (m) {
        const lead = tagText.slice(0, m[0].length);
        pushTok(lines, 'plain', '<');
        if (m[1]) pushTok(lines, 'op', '/');
        pushTok(lines, tags.has(m[2].toLowerCase()) ? 'tag' : 'plain', m[2]);
        let rest = tagText.slice(m[0].length);
        const re = /(\s+)([a-zA-Z_:][\w:.-]*)(\s*=\s*)?("[^"]*"|'[^']*')?/g;
        let last = 0, mm;
        while ((mm = re.exec(rest)) !== null) {
          if (mm.index > last) pushTok(lines, 'plain', rest.slice(last, mm.index));
          if (mm[1]) pushTok(lines, 'plain', mm[1]);
          pushTok(lines, 'attr', mm[2]);
          if (mm[3]) pushTok(lines, 'op', mm[3]);
          if (mm[4]) pushTok(lines, 'str', mm[4]);
          last = re.lastIndex;
        }
        if (last < rest.length) pushTok(lines, 'plain', rest.slice(last));
      } else {
        pushTok(lines, 'plain', tagText);
      }
      i = stop; continue;
    }
    let j = i;
    while (j < n && src[j] !== '<' && src[j] !== '\n') j++;
    pushTok(lines, 'plain', src.slice(i, j)); i = j;
  }
  return lines;
}

function scanCSS(src) {
  const lines = [[]];
  let i = 0, n = src.length, mode = 'sel';
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('/*', i)) {
      const end = src.indexOf('*/', i + 2);
      const stop = end === -1 ? n : end + 2;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && src[j] !== c && src[j] !== '\n') j++;
      pushTok(lines, 'str', src.slice(i, Math.min(j + 1, n))); i = Math.min(j + 1, n); continue;
    }
    if (c === '{') { pushTok(lines, 'op', '{'); mode = 'decl'; i++; continue; }
    if (c === '}') { pushTok(lines, 'op', '}'); mode = 'sel'; i++; continue; }
    if (c === ';') { pushTok(lines, 'op', ';'); i++; continue; }
    if (c === ':') { pushTok(lines, 'op', ':'); i++; continue; }
    if (mode === 'sel') {
      let j = i;
      while (j < n && !'{}\n'.includes(src[j]) && !src.startsWith('/*', j)) j++;
      pushTok(lines, 'sel', src.slice(i, j)); i = j; continue;
    }
    if (/[a-zA-Z-]/.test(c)) {
      let j = i;
      while (j < n && /[a-zA-Z-]/.test(src[j])) j++;
      let k = j;
      while (k < n && /\s/.test(src[k]) && src[k] !== '\n') k++;
      pushTok(lines, src[k] === ':' ? 'prop' : 'plain', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c) || c === '#') {
      let j = i + 1;
      while (j < n && /[0-9A-Fa-f%#]/.test(src[j])) j++;
      if (/[a-zA-Z]/.test(src[i] || '')) { pushTok(lines, 'plain', src.slice(i, j)); }
      else pushTok(lines, 'num', src.slice(i, j));
      i = j; continue;
    }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function tokenizeAll(code, langId) {
  if (langId === 'html') return scanHTML(code);
  if (langId === 'css') return scanCSS(code);
  if (langId === 'sql') return scanSQL(code);
  if (langId === 'plain' || !LANGS[langId]) {
    return String(code).split('\n').map(l => (l ? [['plain', l]] : []));
  }
  return scanClike(code, LANGS[langId]);
}
/* ================= 逐行解释规则 ================= */
const TAG_LABEL = {
  comment:'注释', import:'导入', func:'函数', 'class':'类', decorator:'装饰器',
  cond:'判断', loop:'循环', output:'输出', input:'输入', assign:'赋值',
  return:'返回', call:'调用', with:'资源', try:'异常处理', jump:'跳出',
  blank:'空行', stmt:'语句', tag:'标签', prop:'属性', text:'文字', sql:'SQL'
};

function rangeDesc(args) {
  if (args.length === 1) return '从 0 到 ' + (parseInt(args[0], 10) - 1) + '，共 ' + args[0] + ' 次';
  if (args.length === 2) return '从 ' + args[0] + ' 到 ' + args[1] + '-1';
  if (args.length === 3) return '从 ' + args[0] + ' 到 ' + args[1] + '-1，每步 +' + args[2];
  return '';
}

function pyRule(s) {
  let m;
  if (/^#/.test(s)) return { note: '注释：' + s.replace(/^#+\s*/, ''), tag: 'comment' };
  if (/^("""|''')/.test(s)) return { note: '文档字符串（三引号里的说明文字，不算代码逻辑）', tag: 'comment' };
  if ((m = s.match(/^from\s+([\w.]+)\s+import\s+(.+)$/))) return { note: '从模块 ' + m[1] + ' 中导入：' + m[2], tag: 'import' };
  if ((m = s.match(/^import\s+(.+)$/))) return { note: '导入模块：' + m[1].replace(/\s+as\s+/g, '，并重命名为 '), tag: 'import' };
  if ((m = s.match(/^def\s+(\w+)\s*\((.*?)\)\s*(?:->\s*([^{]+?))?\s*:/))) return { note: '定义函数 ' + m[1] + '，参数：' + (m[2] || '无') + (m[3] ? '，返回类型 ' + m[3].trim() : ''), tag: 'func' };
  if ((m = s.match(/^class\s+(\w+)\s*(?:\((.*?)\))?\s*:/))) return { note: '定义类 ' + m[1] + (m[2] ? '，继承自 ' + m[2] : ''), tag: 'class' };
  if ((m = s.match(/^@(\w+)/))) return { note: '装饰器 @' + m[1] + '：给下面的函数/类附加功能', tag: 'decorator' };
  if ((m = s.match(/^if\s+(.+?)\s*:$/))) return { note: '如果 ' + m[1] + ' 成立，就执行下面的代码块', tag: 'cond' };
  if ((m = s.match(/^elif\s+(.+?)\s*:$/))) return { note: '否则如果 ' + m[1] + ' 成立，就执行下面的代码块', tag: 'cond' };
  if ((m = s.match(/^else\s*:$/))) return { note: '否则：上面条件都不成立时执行', tag: 'cond' };
  if ((m = s.match(/^for\s+(.+?)\s+in\s+range\s*\((.*?)\)\s*:$/))) return { note: '循环 ' + m[1] + '：' + rangeDesc(m[2].split(',').map(x => x.trim())), tag: 'loop' };
  if ((m = s.match(/^for\s+(.+?)\s+in\s+(.+?)\s*:$/))) return { note: '循环：' + m[1] + ' 依次取 ' + m[2] + ' 里的每个元素', tag: 'loop' };
  if ((m = s.match(/^while\s+(.+?)\s*:$/))) return { note: '只要 ' + m[1] + ' 为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^return\b\s*(.*)$/))) return { note: m[1] ? '返回 ' + m[1] : '返回（结束函数，不返回值）', tag: 'return' };
  if ((m = s.match(/^print\s*\((.*)\)\s*$/))) return { note: '输出：' + m[1], tag: 'output' };
  if ((m = s.match(/^input\s*\((.*)\)\s*$/))) return { note: '等待用户输入' + (m[1] ? '，提示语：' + m[1] : ''), tag: 'input' };
  if ((m = s.match(/^with\s+(.+?)\s+as\s+(\w+)\s*:/))) return { note: '打开 ' + m[1] + '，用变量 ' + m[2] + ' 引用，离开代码块时自动关闭', tag: 'with' };
  if (/^try\s*:$/.test(s)) return { note: '尝试执行下面的代码（可能出错）', tag: 'try' };
  if ((m = s.match(/^except\s*(.*?)\s*:/))) return { note: '捕获异常' + (m[1] ? '：' + m[1] : '（任意异常）'), tag: 'try' };
  if (/^finally\s*:/.test(s)) return { note: '不管有没有出错，收尾代码都会执行', tag: 'try' };
  if (/^break\b/.test(s)) return { note: '立刻跳出当前循环', tag: 'jump' };
  if (/^continue\b/.test(s)) return { note: '跳过本次循环剩下的部分，进入下一次', tag: 'jump' };
  if (/^pass\b/.test(s)) return { note: '占位：什么都不做', tag: 'stmt' };
  if ((m = s.match(/^raise\s+(.+)$/))) return { note: '主动抛出异常：' + m[1], tag: 'try' };
  if ((m = s.match(/^assert\s+(.+)$/))) return { note: '断言：' + m[1] + ' 不成立就报错', tag: 'cond' };
  if ((m = s.match(/^del\s+(.+)$/))) return { note: '删除 ' + m[1], tag: 'stmt' };
  if ((m = s.match(/^(\w+(?:\[[^\]]*\])?)\s*=(?!=)\s*(.+)$/))) return { note: '把「' + m[2] + '」赋给变量 ' + m[1], tag: 'assign' };
  if ((m = s.match(/^(\w+(?:\.\w+)*)\s*\(.*\)\s*$/))) return { note: '调用 ' + m[1] + '(...)', tag: 'call' };
  if ((m = s.match(/^(\w+)\.(\w+)\s*\(/))) return { note: '调用 ' + m[1] + ' 的方法 ' + m[2] + '(...)', tag: 'call' };
  if ((m = s.match(/^\[.*\bfor\b.*\bin\b.*\]$/))) return { note: '列表推导式：按规则生成一个新列表', tag: 'stmt' };
  return null;
}

const C_TYPES = /^(int|char|float|double|long|short|void|bool|unsigned|signed|size_t|auto|const\s+int|const\s+char|struct\s+\w+|class\s+\w+)$/;
// C/C++ 声明：限定词可以叠（long long / unsigned int / const char），
// 声明符可以有多个（long long l, r;），可以带指针和初值。
const C_DECL_TYPE = '(?:(?:const|static|unsigned|signed|volatile|register|long|short|extern)\\s+)*'
  + '(?:int|long|short|unsigned|signed|char|float|double|bool|void|size_t|auto|string|wchar_t|FILE|'
  + 'int64_t|uint64_t|int32_t|uint32_t|struct\\s+\\w+|class\\s+\\w+)';

const BLOCK_KIND = { struct: '结构体', 'class': '类', union: '联合体', enum: '枚举', namespace: '命名空间' };

function cRule(s) {
  let m;
  if (/^\/\//.test(s)) return { note: '注释：' + s.replace(/^\/+\s*/, ''), tag: 'comment' };
  if (/^\/\*/.test(s)) return { note: '块注释开始', tag: 'comment' };
  if (/^\*/.test(s)) return { note: '块注释内容', tag: 'comment' };
  if (/^\};?$/.test(s)) return { note: '', tag: 'stmt', closing: true };
  if (/^\}/.test(s)) return { note: '', tag: 'stmt', closing: true };
  if (/^\{/.test(s)) return { note: '代码块从这里开始', tag: 'stmt' };
  if ((m = s.match(/^using\s+namespace\s+(\w+)\s*;/))) return { note: '引入「' + m[1] + '」命名空间，下面可以直接用里面的名字', tag: 'import' };
  if (/^cout\s*<</.test(s)) return { note: '输出到控制台（cout <<）', tag: 'output' };
  if (/^cin\s*>>/.test(s)) return { note: '从控制台读入数据（cin >>）', tag: 'input' };

  if ((m = s.match(/^#\s*define\s+(\w+)\s*(.*)$/))) return { note: '宏定义「' + m[1] + '」' + (m[2] ? '，预处理时替换成 ' + m[2] : ''), tag: 'import' };
  if ((m = s.match(/^int\s+main\s*\(/)) || /^void\s+main\s*\(/.test(s)) return { note: '程序入口 main 函数：程序从这里开始执行', tag: 'func' };

  if ((m = s.match(/^(if|else\s+if)\s*\((.*)\)/))) return { note: '如果「' + m[2] + '」成立，执行下面的代码块', tag: 'cond' };
  if (/^else\b/.test(s)) return { note: '否则：上面条件不成立时执行', tag: 'cond' };

  if ((m = s.match(C_DECL_RE))) {
    const typeTxt = m[1].trim();

    const bare = names.map(n => n.replace(/\[[^\]]*\]/g, '').replace(/^\*/, '').trim());
    const isArr = names.some(n => /\[[^\]]*\]/.test(n));
    const typePart = isPtr ? '指向 ' + typeTxt + ' 的指针' : typeTxt + (isArr ? ' 数组' : ' 变量');
    const quoted = bare.length > 1 ? '，分别是「' + bare.join('」「') + '」' : '「' + (bare[0] || '') + '」';
    const init = m[4] ? '，初值「' + m[4].replace(/^=\s*/, '').trim() + '」' : '';
    return {
      note: '声明 ' + (bare.length > 1 ? bare.length + ' 个 ' + typePart : typePart) + quoted + init,
      tag: 'assign'
    };
  }
  if ((m = s.match(/^return\b\s*(.*?);?$/))) return { note: m[1] ? '返回 ' + m[1] : '返回（不返回值）', tag: 'return' };
  if ((m = s.match(/^(typedef\s+)?(struct|class|union|enum|namespace)\s+(\w+)\s*\{?\s*$/))) {
    return { note: '定义' + BLOCK_KIND[m[2]] + '「' + m[3] + '」，花括号里是它的成员', tag: 'class' };
  }
  if ((m = s.match(/^(typedef\s+)?(struct|class|union|enum)\s+(\w+)/))) {
    return { note: '定义' + BLOCK_KIND[m[2]] + '「' + m[3] + '」', tag: 'class' };
  }
  if ((m = s.match(/^(\w+)\s*=(?!=)\s*(.+);$/))) return { note: '把「' + m[2] + '」赋给变量「' + m[1] + '」', tag: 'assign' };
  if ((m = s.match(/^(\w+)\s*\(.*\);$/))) return { note: '调用函数「' + m[1] + '」', tag: 'call' };
  if (/^break\b/.test(s)) return { note: '跳出当前循环', tag: 'jump' };
  if (/^continue\b/.test(s)) return { note: '跳过本次循环剩下的部分，进入下一次', tag: 'jump' };
  return null;
}

function javaRule(s) {
  let m;
  if (/^\/\//.test(s)) return { note: '注释：' + s.replace(/^\/+\s*/, ''), tag: 'comment' };
  if (/^\/\*/.test(s)) return { note: '块注释开始', tag: 'comment' };
  if (/^\};?$/.test(s)) return { note: '', tag: 'stmt', closing: true };
  if (/^\{/.test(s)) return { note: '代码块从这里开始', tag: 'stmt' };
  if ((m = s.match(/^package\s+([\w.]+);/))) return { note: '声明当前文件属于包 ' + m[1], tag: 'import' };
  if ((m = s.match(/^import\s+(.+);/))) return { note: '导入 ' + m[1], tag: 'import' };
  if (/^public\s+class\s+(\w+)/.test(s)) return { note: '定义公开类 ' + s.match(/class\s+(\w+)/)[1] + '，类名要和文件名一致', tag: 'class' };
  if ((m = s.match(/^public\s+static\s+void\s+main\s*\(/))) return { note: '程序入口 main 方法：Java 程序从这里开始执行', tag: 'func' };
  if (/^@Override/.test(s)) return { note: '注解 @Override：表示这是重写父类的方法', tag: 'decorator' };
  if ((m = s.match(/^(public|private|protected)?\s*(static)?\s*(void|int|double|float|long|boolean|char|String|List|Map)\s+(\w+)\s*\(/))) return { note: '定义方法 ' + m[4] + '，返回 ' + m[3], tag: 'func' };
  if ((m = s.match(/^(int|double|float|long|boolean|char|byte|short|String|var)\s+(\w+)\s*(=.*)?;/))) return { note: '声明 ' + m[1] + ' 变量 ' + m[2] + (m[3] ? '，并赋初值 ' + m[3].replace(/^=\s*/, '') : ''), tag: 'assign' };
  if ((m = s.match(/^System\.out\.(println|print|printf)\s*\(/))) return { note: m[1] === 'println' ? '打印一行并换行' : '打印内容（不换行）', tag: 'output' };
  if ((m = s.match(/^Scanner\s+\w+\s*=\s*new\s+Scanner\s*\(/))) return { note: '创建 Scanner 对象，准备读取控制台输入', tag: 'input' };
  if ((m = s.match(/^for\s*\((.*)\)/))) return { note: 'for 循环：' + (m[1].includes(':') ? '遍历集合里的每个元素' : '按三段式控制循环次数'), tag: 'loop' };
  if ((m = s.match(/^while\s*\((.*)\)/))) return { note: '只要「' + m[1] + '」为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^if\s*\((.*)\)/))) return { note: '如果「' + m[1] + '」成立，执行下面的代码块', tag: 'cond' };
  if (/^else\b/.test(s)) return { note: '否则：上面条件不成立时执行', tag: 'cond' };
  if ((m = s.match(/^return\b\s*(.*?);?$/))) return { note: m[1] ? '返回 ' + m[1] : '返回', tag: 'return' };
  if ((m = s.match(/^try\s*\{/))) return { note: '尝试执行下面的代码（可能出错）', tag: 'try' };
  if ((m = s.match(/^catch\s*\((.*?)\)/))) return { note: '捕获异常：' + m[1], tag: 'try' };
  if ((m = s.match(/^(\w+)\s*=(?!=)\s*(.+);$/))) return { note: '把「' + m[2] + '」赋给 ' + m[1], tag: 'assign' };
  if ((m = s.match(/^(\w+)\s*\(.*\);/))) return { note: '调用方法 ' + m[1] + '(...)', tag: 'call' };
  return null;
}

function jsRule(s) {
  let m;
  if (/^\/\//.test(s)) return { note: '注释：' + s.replace(/^\/+\s*/, ''), tag: 'comment' };
  if (/^\/\*/.test(s)) return { note: '块注释开始', tag: 'comment' };
  if (/^\};?$/.test(s)) return { note: '', tag: 'stmt', closing: true };
  if (/^\{/.test(s)) return { note: '代码块从这里开始', tag: 'stmt' };
  if ((m = s.match(/^(const|let|var)\s+(\w+)\s*=\s*(.+?);?$/))) return { note: '声明' + (m[1] === 'const' ? '常量' : '变量') + ' ' + m[2] + '，初始值「' + m[3] + '」', tag: 'assign' };
  if ((m = s.match(/^function\s+(\w+)\s*\(([^)]*)\)/))) return { note: '定义函数 ' + m[1] + '，参数：' + (m[2] || '无'), tag: 'func' };
  if ((m = s.match(/^(const|let|var)\s+(\w+)\s*=\s*\(([^)]*)\)\s*=>/))) return { note: '定义箭头函数 ' + m[2] + '，参数：' + (m[3] || '无'), tag: 'func' };
  if (/^console\.(log|error|warn)\s*\(/.test(s)) return { note: '在控制台输出' + (s.match(/^console\.(\w+)/)[1] === 'log' ? '' : '（' + s.match(/^console\.(\w+)/)[1] + '）'), tag: 'output' };
  if ((m = s.match(/^for\s*\((.*)\)/))) return { note: 'for 循环：' + (m[1].includes('of') || m[1].includes('in') ? '遍历数组/对象的每个元素' : '按三段式控制循环次数'), tag: 'loop' };
  if ((m = s.match(/^while\s*\((.*)\)/))) return { note: '只要「' + m[1] + '」为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^if\s*\((.*)\)/))) return { note: '如果「' + m[1] + '」成立，执行下面的代码块', tag: 'cond' };
  if (/^else\b/.test(s)) return { note: '否则：上面条件不成立时执行', tag: 'cond' };
  if ((m = s.match(/^return\b\s*(.*?);?$/))) return { note: m[1] ? '返回 ' + m[1] : '返回', tag: 'return' };
  if ((m = s.match(/^import\s+(.+?)\s+from\s+(.+?);?$/))) return { note: '从 ' + m[2] + ' 导入 ' + m[1], tag: 'import' };
  if ((m = s.match(/^export\s+default\s+(.+)$/))) return { note: '默认导出：' + m[1], tag: 'import' };
  if ((m = s.match(/^export\s+(.+)$/))) return { note: '导出：' + m[1], tag: 'import' };

function sqlRule(s) {
  const u = s.toUpperCase();
  let m;
  if (u.startsWith('--')) return { note: '注释：' + s.replace(/^--+\s*/, ''), tag: 'comment' };
  if (/^;\s*$/.test(s)) return { note: '语句结束（分号表示这一句写完了）', tag: 'stmt' };
  if (/^\s*SELECT\b/.test(u)) {
    let note = '查询：取 ';
    const cols = s.match(/SELECT\s+([\s\S]*?)(?:\s+FROM\b|$)/i);
    if (cols) {
      note += (cols[1].trim() === '*' ? '所有列' : '列 ' + cols[1].trim());
      const tb = s.match(/FROM\s+(\w+)/i);
      if (tb) note += '，来自表「' + tb[1] + '」';
    } else note += '数据';
    return { note: note, tag: 'sql' };
  }
  if (/^\s*INSERT\b/.test(u)) {
    const tb = s.match(/INTO\s+(\w+)/i);
    return { note: '插入：往' + (tb ? '表「' + tb[1] + '」' : '表') + '里加一行新数据', tag: 'sql' };
  }
  if (/^\s*UPDATE\b/.test(u)) {
    const tb = s.match(/UPDATE\s+(\w+)/i), st = s.match(/SET\s+([\s\S]*?)\s+WHERE\b/i);
    return { note: '更新：改' + (tb ? '表「' + tb[1] + '」' : '表') + (st ? '里的 ' + st[1].trim() : '') + '（WHERE 指定改哪些行）', tag: 'sql' };
  }
  if (/^\s*DELETE\b/.test(u)) {
    const tb = s.match(/FROM\s+(\w+)/i);
    return { note: '删除：从' + (tb ? '表「' + tb[1] + '」' : '表') + '里删掉满足 WHERE 条件的行', tag: 'sql' };
  }
  // DDL：建库 / 建表 / 建索引视图 / 改表 / 删
  if ((m = s.match(/^\s*CREATE\s+(DATABASE|SCHEMA)\s+(?:IF\s+NOT\s+EXISTS\s+)?([\w`"]+)/i))) {
    return { note: '建库：新建一个名为「' + m[2].replace(/[`"]/g, '') + '」的数据库', tag: 'sql' };
  }
  if ((m = s.match(/^\s*CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?([\w`".]+)/i))) {
    return { note: '建表：新建表「' + m[1].replace(/[`"]/g, '') + '」，括号里是列名和类型', tag: 'sql' };
  }
  if ((m = s.match(/^\s*CREATE\s+(INDEX|VIEW|TRIGGER|PROCEDURE|FUNCTION)\s+(?:IF\s+NOT\s+EXISTS\s+)?([\w`".]+)/i))) {
    const kind = { INDEX: '索引', VIEW: '视图', TRIGGER: '触发器', PROCEDURE: '存储过程', FUNCTION: '函数' }[m[1].toUpperCase()];
    return { note: '新建' + kind + '「' + m[2].replace(/[`"]/g, '') + '」', tag: 'sql' };
  }
  if ((m = s.match(/^\s*ALTER\s+TABLE\s+([\w`".]+)/i))) {
    return { note: '改表结构：修改表「' + m[1].replace(/[`"]/g, '') + '」的列（加列、改列、删列）', tag: 'sql' };
  }
  if ((m = s.match(/^\s*DROP\s+(DATABASE|SCHEMA|TABLE|INDEX|VIEW)\s+(?:IF\s+EXISTS\s+)?([\w`".]+)/i))) {
    const kind = { DATABASE: '数据库', SCHEMA: '模式', TABLE: '表', INDEX: '索引', VIEW: '视图' }[m[1].toUpperCase()];
    return { note: '删除' + kind + '「' + m[2].replace(/[`"]/g, '') + '」（连数据一起，别随手跑）', tag: 'sql' };
  }
  if ((m = s.match(/^\s*TRUNCATE\s+(?:TABLE\s+)?([\w`".]+)/i))) {
    return { note: '清空表「' + m[1].replace(/[`"]/g, '') + '」里的所有行（结构还在，删得比 DELETE 快）', tag: 'sql' };
  }
  if ((m = s.match(/^\s*USE\s+([\w`".]+)/i))) return { note: '切换数据库：后面动的是「' + m[1].replace(/[`"]/g, '') + '」', tag: 'sql' };
  if (/^\s*SHOW\b/.test(u)) return { note: '查看库/表/列清单：' + s.replace(/;$/, ''), tag: 'sql' };
  if ((m = s.match(/^\s*(DESCRIBE|DESC|EXPLAIN)\s+([\w`".]+)/i))) return { note: '看表「' + m[2].replace(/[`"]/g, '') + '」的结构（列名、类型）', tag: 'sql' };
  if (/^\s*(BEGIN|START)\b/.test(u)) return { note: '开启事务：从这里开始的一组操作要么全成、要么全不成', tag: 'sql' };
  if (/^\s*COMMIT\b/.test(u)) return { note: '提交事务：把这一串修改真正写进数据库', tag: 'sql' };
  if (/^\s*ROLLBACK\b/.test(u)) return { note: '回滚事务：撤销还没提交的修改', tag: 'sql' };
  if (/^\s*(GRANT|REVOKE)\b/.test(u)) return { note: '权限管理：' + s.replace(/;$/, ''), tag: 'sql' };
  if (/^\s*FROM\s+(\w+)/.test(u)) {
    const tb = s.match(/FROM\s+(\w+)/i);
    return { note: '从表「' + tb[1] + '」里取数据', tag: 'sql' };
  }
  if (/^\s*(GROUP\s+BY|ORDER\s+BY|HAVING|WHERE|LIMIT|OFFSET|JOIN|INNER|LEFT|RIGHT|OUTER|ON|VALUES|SET|AND|OR)\b/.test(u)) {
    return { note: 'SQL 子句：' + s.replace(/;$/, ''), tag: 'sql' };
  }
  return null;
}

function htmlRule(s) {
  if (/^<!--/.test(s)) return { note: 'HTML 注释', tag: 'comment' };
  let m;
  if ((m = s.match(/^<(\/?)([a-zA-Z0-9-]+)/))) {
    const info = DICT.web[m[2].toLowerCase()];
    if (m[1]) return { note: (info ? info.zh + ' ' : '') + '标签结束：</' + m[2] + '>', tag: 'tag' };
    return { note: (info ? '开始' + info.zh + '：' : '开始标签：') + '<' + m[2] + '>' + (info ? '（' + info.d + '）' : ''), tag: 'tag' };
  }
  if (s.trim()) return { note: '页面上的文字内容', tag: 'text' };
  return null;
}

function cssRule(s) {
  if (/^\/\*/.test(s)) return { note: '注释', tag: 'comment' };
  let m;
  if ((m = s.match(/^([^{}]+)\{\s*$/))) return { note: '选择器「' + m[1].trim() + '」：给匹配的元素设置样式', tag: 'prop' };
  if (/^\}/.test(s)) return { note: '样式块结束', tag: 'prop' };
  if ((m = s.match(/^([\w-]+)\s*:\s*(.+?);?$/))) {
    const key = m[1].toLowerCase();
    const info = DICT.web[key];
    return { note: (info ? info.zh + '：' : '') + m[1] + ' = ' + m[2].replace(/;$/, ''), tag: 'prop' };
  }
  return null;
}

const RULE_FN = { python: pyRule, c: cRule, cpp: cRule, java: javaRule, js: jsRule, sql: sqlRule, html: htmlRule, css: cssRule, plain: () => null };

function explainLine(text, langId) {
  const s = text.trim();
  if (!s) return { note: '', tag: 'blank' };
  const fn = RULE_FN[langId];
  const r = fn ? fn(s) : null;
  if (r) return r;
  // 规则没命中：按行的形态给最保守的猜测；猜不出就明说没看懂，
  // 不再用「这行执行：xxx」把原代码抄一遍（那是套话，不是解释）。
  let m;
  if ((m = s.match(/^([\w$.\[\]'"]+)\s*([+\-*/%])=\s*(.+?);?$/))) {
    const opMap = { '+': '加', '-': '减', '*': '乘', '/': '除', '%': '取余' };
    return { note: '在「' + m[1] + '」原来的值上' + opMap[m[2]] + '「' + m[3] + '」', tag: 'assign', fallback: true };
  }
  if ((m = s.match(/^([\w$]+)\.(\w+)\s*\(.*\)\s*;?$/))) {
    return { note: '调用「' + m[1] + '」的「' + m[2] + '」方法', tag: 'call', fallback: true };
  }
  if ((m = s.match(/^([\w$.\[\]'"]+)\s*=(?!=)\s*(.+?);?$/))) {
    return { note: '把「' + m[2] + '」算出来存进「' + m[1] + '」', tag: 'assign', fallback: true };
  }
  if ((m = s.match(/^([\w$.]+)\s*\(.*\)\s*;?$/))) {
    return { note: '调用「' + m[1] + '」', tag: 'call', fallback: true };
  }
  if (/^[\w$.[\]'"0-9]+\s*[-+*/%]?\s*[\w$.[\]'"0-9]/.test(s)) {
    return { note: '算一个值：' + s.replace(/;$/, ''), tag: 'stmt', fallback: true };
  }
  return { note: '这一行没看出固定的套路，原样是：' + s, tag: 'stmt', fallback: true };
}

/* ================= 整体解释与关键字 ================= */
const STEP_TEXT = {
  import: '导入需要的模块/头文件', func: '定义函数', 'class': '定义类', input: '读取用户输入',
  output: '输出结果', loop: '循环处理', cond: '做条件判断', assign: '给变量赋值',
  return: '返回结果', call: '调用函数/方法', with: '打开并管理资源', try: '处理异常',
  jump: '中断/跳过循环', sql: '执行 SQL 操作', tag: '编写页面结构', prop: '设置样式'
};

/* ---------- 结构：这一行在谁里面、整段代码切成哪几块 ---------- */
function blockNameOf(s) {
  let m = s.match(/^(?:typedef\s+)?(struct|class|union|enum|namespace)\s+(\w+)/);
  if (m) return { name: m[2], kind: BLOCK_KIND[m[1]] };
  if (/^(if|for|while|switch|catch|do|else|try)\b/.test(s)) return null;
  m = s.match(/^[\w\s*&<>:,]+?\s(\w+)\s*\([^;{]*\)\s*(?:const)?\s*\{?\s*$/);
  if (m) return { name: m[1], kind: '函数' };
  return null;
}

function computeContexts(lineTexts, langId) {
  const out = new Array(lineTexts.length).fill(null);
  if (!lineTexts.length) return out;
  if (langId === 'plain' || langId === 'html' || langId === 'css' || langId === 'sql') return out;
  if (langId === 'python') {
    const stack = [];
    lineTexts.forEach((t, i) => {
      const s = t.trim();
      if (!s) { out[i] = stack.length ? stack[stack.length - 1] : null; return; }
      const indent = t.length - t.trimStart().length;
      while (stack.length && indent <= stack[stack.length - 1].indent) stack.pop();
      out[i] = stack.length ? stack[stack.length - 1] : null;
      const m = s.match(/^(def|class)\s+(\w+)/);
      if (m && /:\s*(#.*)?$/.test(s)) {
        stack.push({ name: m[2], kind: m[1] === 'def' ? '函数' : '类', indent });
      }
    });
    return out;
  }
  const stack = [];
  let depth = 0;
  lineTexts.forEach((t, i) => {
    const s = t.trim();
    out[i] = stack.length ? stack[stack.length - 1] : null;
    const opens = (s.match(/\{/g) || []).length;
    const closes = (s.match(/\}/g) || []).length;
    const nm = blockNameOf(s);
    if (opens > 0 && nm) stack.push({ name: nm.name, kind: nm.kind, depth: depth + 1 });
    depth += opens - closes;
    while (stack.length && stack[stack.length - 1].depth > depth) stack.pop();
  });
  return out;
}

function findDefRanges(lineTexts, langId) {
  const ranges = [];
  if (langId === 'python') {
    lineTexts.forEach((t, i) => {
      const s = t.trim();
      const m = s.match(/^(def|class)\s+(\w+)/);
      if (!m || !/:\s*(#.*)?$/.test(s)) return;
      const indent = t.length - t.trimStart().length;
      let end = i;
      for (let j = i + 1; j < lineTexts.length; j++) {
        const tj = lineTexts[j], sj = tj.trim();
        if (!sj) continue;
        if (tj.length - tj.trimStart().length <= indent) break;
        end = j;
      }
      ranges.push({ from: i, to: end, name: m[2], kindLabel: m[1] === 'def' ? '函数' : '类' });
    });
    return ranges;
  }
  lineTexts.forEach((t, i) => {
    const s = t.trim();
    const nm = blockNameOf(s);
    if (!nm) return;
    if (!(s.match(/\{/g) || []).length) return;
    let depth = 0, end = i;
    for (let j = i; j < lineTexts.length; j++) {
      depth += (lineTexts[j].match(/\{/g) || []).length - (lineTexts[j].match(/\}/g) || []).length;
      end = j;
      if (depth <= 0) break;
    }
    ranges.push({ from: i, to: end, name: nm.name, kindLabel: nm.kind });
  });
  // 嵌在别的块里的不单独成块（外层那块已经把它包住了）
  return ranges.filter(r => !ranges.some(o => o !== r && o.from <= r.from && o.to >= r.to && (o.from < r.from || o.to > r.to)));
}

function buildBlocks(lineTexts, lineNotes, ranges) {
  const blocks = [];
  const byStart = new Map(ranges.map(r => [r.from, r]));
  let i = 0;
  while (i < lineTexts.length) {
    const def = byStart.get(i);
    if (def) {
      const lines = [];
      for (let k = def.from; k <= def.to; k++) if (lineTexts[k].trim()) lines.push(k);
      blocks.push({ kind: 'def', name: def.name, label: def.kindLabel, from: def.from, to: def.to, lines });
      i = def.to + 1;
      continue;
    }
    const isBlank = !lineTexts[i].trim();
    const isComment = lineNotes[i].tag === 'comment';
    let j = i;
    while (j + 1 < lineTexts.length && !byStart.has(j + 1)) {
      const tj = lineTexts[j + 1], nj = lineNotes[j + 1];
      const same = isBlank ? !tj.trim()
        : isComment ? nj.tag === 'comment'
        : (!!tj.trim() && nj.tag !== 'comment');
      if (!same) break;
      j++;
    }
    const lines = [];
    for (let k = i; k <= j; k++) if (lineTexts[k].trim()) lines.push(k);
    blocks.push({ kind: isBlank ? 'blank' : isComment ? 'comment' : 'stmt', from: i, to: j, lines });
    i = j + 1;
  }
  return blocks;
}

/* ================= 算法类型（离线启发式） =================
   宁可漏报也不乱猜：分不够高就不说，两个候选咬得紧就都说出来。 */
function detectAlgorithms(rawCode, langId) {
  const c = String(rawCode || '');
  const hit = re => re.test(c);
  const out = [];
  const add = (id, name, score, reasons) => {
    if (score >= 2) out.push({ id, name, score, reasons });
  };

  if (hit(/\bmid\b/) && hit(/\b(lo|low|left|begin)\b/i) && hit(/\b(hi|high|right|end)\b/i) && hit(/while|for|return/)) {
    add('binary', '二分查找', 3 + (hit(/>>\s*1|mid\s*=\s*[^;]*\/\s*2/) ? 1 : 0),
      ['拿 mid 从两头往中间收', 'lo / hi 各守一边']);
  }
  if (hit(/\bdp\s*\[/i) || hit(/\bmemo\s*\[/i) || hit(/\bf\s*\[\s*\w+\s*\]\s*\[/)) {
    add('dp', '动态规划', 3 + (hit(/\bmax\s*\(|\bmin\s*\(/) ? 1 : 0) + (hit(/\[\s*\w+\s*\]\s*\[/) ? 1 : 0),
      ['用表存中间结果，避免重复算', '有状态转移的写法']);
  }
  if ((hit(/\bsort\s*\(/) || hit(/\.sort\s*\(/)) && hit(/\b(best|ans|res|max|min)\b/)) {
    add('greedy', '贪心', 3, ['先排序', '再一路挑当前看起来最好的']);
  }
  if (hit(/while\s*\(\s*\w+\s*<\s*\w+\s*\)/) && hit(/\b(i|left|l)\b/) && hit(/\b(j|right|r)\b/)) {
    add('twoptr', '双指针', 2, ['两个下标各走一边']);
  }
  if (hit(/\b(left|low|l)\b/) && hit(/\b(right|high|r)\b/) && hit(/\b(left|low|l)\b\s*(\+\+|\+=|=\s*\w+\s*\+)/)) {
    add('window', '滑动窗口', 2, ['有左右两端', '窗口会往里收']);
  }
  if (hit(/\b(queue|deque|q)\b/) && hit(/\b(push|append|offer|enqueue)\b/) && hit(/\b(poll|popleft|dequeue|front|pop)\b/) && hit(/\bvis(ited)?\b|\[.*\]\s*=\s*(1|true)/)) {
    add('bfs', '广度优先搜索', 3, ['用队列一层层往外走', '拿 visited 记账，不重复走']);
  }
  if (hit(/dfs|backtrack/i) && hit(/\b(vis|visited|used|mark)\b/) && hit(/\b(return|= 0|= false)/)) {
    add('dfs', '深度优先 / 回溯', 3, ['自己调自己往下钻', '钻回来会把标记撤销']);
  }
  if (hit(/\bparent\s*\[/) && hit(/\bfind\s*\(/) && hit(/parent\s*\[\s*\w+\s*\]\s*=\s*\w+/)) {
    add('dsu', '并查集', 3, ['用 parent 数组存谁是老大', 'find 一路往上找根']);
  }
  if (hit(/\bdist\s*\[/) && hit(/dist\s*\[[^\]]+\]\s*[+=]/) && hit(/\bif\s*\(\s*dist/)) {
    add('shortest', '最短路', 3, ['dist 存距离', '有不满足就更新的松弛写法']);
  }
  if (hit(/\b(stack)\b/) && hit(/\b(push|append)\b/) && hit(/\b(pop|top)\b/)) {
    add('stack', '栈', 2, ['后进先出']);
  }
  // 递归：函数体里出现自己的名字（只做粗判）
  const fnName = (c.match(/\b(?:def|function)\s+(\w+)\s*\(/) || [])[1];
  if (fnName && new RegExp('\\b' + fnName + '\\s*\\(').test(c.slice(c.indexOf(fnName, c.indexOf(fnName) + 1) >= 0 ? c.indexOf(fnName) + fnName.length : c.length))) {
    if (!hit(/\bmemo\s*\[|\bdp\s*\[/i)) add('recursion', '递归', 2, ['函数自己调自己']);
  }
  {
    const loops = (c.match(/\bfor\s*\(/g) || []).length + (c.match(/\bwhile\s*\(/g) || []).length;
    if (loops >= 3 && !out.length) add('bruteforce', '枚举 / 暴力', 2, ['套了好几层循环', '一个个试过去']);
  }

  out.sort((a, b) => b.score - a.score);
  return out;
}

/* ================= 离线纠错 =================
   只报能确定的：语义错误（死循环、越界）离线看不出来，交给人/AI。 */
function stripCodeNoise(s) {
  return String(s)
    .replace(/"(?:\\.|[^"\\])*"/g, '""')
    .replace(/'(?:\\.|[^'\\])*'/g, "''")
    .replace(/`(?:\\.|[^`\\])*`/g, '``')
    .replace(/\/\/.*$/, '')
    .replace(/#.*$/, '');
}

function lintCode(rawCode, langId) {
  const issues = [];
  const lines = String(rawCode || '').split(/\r?\n/);
  const MAX = 40;
  const add = (line, col, severity, msg, hint) => {
    if (issues.length >= MAX) return;
    issues.push({ line, col: col || 0, severity, msg, hint: hint || '' });
  };

  // 1) 括号 / 引号配对：跳过字符串、行注释、块注释
  const stack = [];
  let inStr = null, inBlock = false;
  for (let i = 0; i < lines.length; i++) {
    const s = lines[i];
    for (let k = 0; k < s.length; k++) {
      const ch = s[k], nx = s[k + 1];
      if (inBlock) { if (ch === '*' && nx === '/') { inBlock = false; k++; } continue; }
      if (inStr) {
        if (ch === '\\') { k++; continue; }
        if (ch === inStr) inStr = null;
        continue;
      }
      if (ch === '/' && nx === '/') break;
      if (ch === '/' && nx === '*') { inBlock = true; k++; continue; }
      if (ch === '#' && (langId === 'python' || langId === 'plain')) break;
      if (ch === '"' || ch === "'" || ch === '`') { inStr = ch; continue; }
      if (ch === '(' || ch === '[' || ch === '{') stack.push({ ch, line: i + 1, col: k + 1 });
      else if (ch === ')' || ch === ']' || ch === '}') {
        const want = ch === ')' ? '(' : ch === ']' ? '[' : '{';
        const top = stack.pop();
        if (!top || top.ch !== want) {
          add(i + 1, k + 1, 'error', '这里的 ' + ch + ' 对不上',
            top ? ('第 ' + top.line + ' 行那个 ' + top.ch + ' 还开着') : ('前面没有对应的 ' + want));
        }
      }
    }
  }
  if (inStr) add(lines.length, 0, 'error', '字符串的 ' + inStr + ' 一直没关', '从这里开始一路到底都没闭合');
  if (inBlock) add(lines.length, 0, 'error', '块注释没闭合', '缺一个 */');
  stack.slice(-3).forEach(t => add(t.line, t.col, 'error', '这个 ' + t.ch + ' 一直开着', '到最后也没关上'));

  // 2) 每行：中文标点、全角空格、if/while 里的单 =
  const CJK = /[，。；：、（）【】「」『』“”‘’！？]/;
  lines.forEach((s, i) => {
    if (!s.trim()) return;
    const code = stripCodeNoise(s);
    const m = code.match(CJK);
    if (m) add(i + 1, code.indexOf(m[0]) + 1, 'error', '中文「' + m[0] + '」混进代码了', '换成英文标点，编译器不认中文符号');
    if (/\u3000/.test(code)) add(i + 1, code.indexOf('\u3000') + 1, 'warn', '这里有全角空格', '全角空格长得像空格，但不是，换成普通空格');
    const cond = code.match(/\b(?:if|while)\s*\(([^)]*)\)/);
    if (cond) {
      const rest = cond[1].replace(/[=!<>+\-*/%&|^]=/g, '');
      if (rest.indexOf('=') >= 0) {
        add(i + 1, code.indexOf('=') + 1, 'error', '这里是判断，条件里只能有一个 =', '想比较要写 ==；写成一个 = 是把值赋进去，条件几乎永远成立');
      }
    }
  });

  // 3) tab / 空格缩进混用（整份文件层面，同层才会出问题，这里只提醒）
  {
    let tabs = 0, spaces = 0;
    lines.forEach(s => { if (/^\t+/.test(s)) tabs++; else if (/^ {2,}/.test(s)) spaces++; });
    if (tabs >= 1 && spaces >= 1) {
      add(1, 0, 'warn', 'tab 和空格混着缩进', 'Python 会直接报错；别的语言看着也别扭，统一成一种');
    }
  }

  // 4) C/Java/JS 行尾像少了分号
  if (langId === 'c' || langId === 'cpp' || langId === 'java' || langId === 'js') {
    lines.forEach((s, i) => {
      const t = s.trim();
      if (!t || t.startsWith('//') || t.startsWith('*') || t.startsWith('/*')) return;
      if (/^(#|\}|\{|else\b|if\b|for\b|while\b|switch\b|case\b|default\b|do\b|try\b|catch\b|public\b|private\b|protected\b|class\b|import\b|package\b|using\b|namespace\b|template\b|typedef\b|struct\b|enum\b|return\b.*\{)/.test(t)) return;
      if (/[;{}()\[\],:>+\-*/%&|=]$/.test(t)) return;
      if (/<(?!<)\w*$/.test(t)) return;
      const next = (lines[i + 1] || '').trim();
      if (!next || /^[{.)\]}]/.test(next)) return;
      if (/\w\s*$/.test(t)) add(i + 1, t.length, 'warn', '这行结尾像少了分号', '要是下一行是接着写的，那就是多行表达式，忽略这条');
    });
  }

  issues.sort((a, b) => a.line - b.line);
  return issues;
}

function analyze(rawCode, langId) {
  const tokenLines = tokenizeAll(rawCode, langId);
  const lineTexts = tokenLines.map(ts => ts.map(t => t[1]).join(''));
  const lineNotes = lineTexts.map(t => explainLine(t, langId));
  const contexts = computeContexts(lineTexts, langId);
  // 收尾那行光说「代码块结束」等于没说：把它收的是哪个块补上
  lineNotes.forEach((n, i) => {
    if (!n || !n.closing) return;
    const ctx = contexts[i];
    delete n.closing;
    if (!ctx) { n.note = '这一层代码到这里结束'; return; }
    if (ctx.kind === '函数') n.note = '函数「' + ctx.name + '」的代码到这里结束';
    else if (ctx.kind) n.note = ctx.kind + '「' + ctx.name + '」的成员到此结束';
    else n.note = '「' + ctx.name + '」到此结束';
  });
  const stats = {
    total: lineTexts.length,
    code: lineTexts.filter(t => t.trim()).length,
    blank: lineTexts.filter(t => !t.trim()).length
  };
  const blocks = buildBlocks(lineTexts, lineNotes, findDefRanges(lineTexts, langId));
  const funcs = [], classes = [];
  lineTexts.forEach((t, idx) => {
    const s = t.trim();
    let m;
    if (langId === 'python' && (m = s.match(/^def\s+(\w+)\s*\(([^)]*)\)/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: 'def ' + m[1] + '(' + m[2] + ')' });
    else if (langId === 'java' && (m = s.match(/(?:public|private|protected)?\s*(?:static\s+)?(?:void|int|double|boolean|String)\s+(\w+)\s*\(([^)]*)\)\s*\{?$/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: m[1] + '(' + m[2] + ')' });
    else if ((langId === 'c' || langId === 'cpp') && (m = s.match(/^(int|void|char|float|double|bool|long)\s+(\w+)\s*\(([^;]*)\)\s*\{?$/))) funcs.push({ name: m[2], args: m[3], line: idx + 1, sig: m[1] + ' ' + m[2] + '(' + m[3] + ')' });
    else if (langId === 'js' && (m = s.match(/^function\s+(\w+)\s*\(([^)]*)\)/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: 'function ' + m[1] + '(' + m[2] + ')' });
    if ((m = s.match(/^class\s+(\w+)/))) classes.push({ name: m[1], line: idx + 1 });
  });
  const tags = lineNotes.map(n => n.tag).filter(t => t !== 'blank' && t !== 'comment' && t !== 'return');
  const steps = [];
  tags.forEach(t => {
    if (!STEP_TEXT[t]) return;
    if (!steps.includes(STEP_TEXT[t])) steps.push(STEP_TEXT[t]);
  });
  const summaryParts = [];
  summaryParts.push('这段 ' + langLabel(langId) + ' 代码共 ' + stats.total + ' 行，其中有效代码 ' + stats.code + ' 行。');
  if (classes.length) summaryParts.push('定义了 ' + classes.length + ' 个类：' + classes.map(c => c.name).join('、') + '。');
  if (funcs.length) summaryParts.push('定义了 ' + funcs.length + ' 个函数：' + funcs.map(f => f.name).join('、') + '。');
  if (steps.length) summaryParts.push('主要流程是：' + steps.join(' → ') + '。');
  const notedCount = lineNotes.filter(n => lineIsNoted(n)).length;
  return {
    lang: langId,
    stats,
    summary: summaryParts.join(''),
    steps: steps,
    funcs,
    classes,
    blocks,
    lineTexts,
    lineNotes,
    tokenLines,
    notedCount,
    algo: detectAlgorithms(rawCode, langId),
    lint: lintCode(rawCode, langId),
    keywords: collectKeywords(tokenLines, langId)
  };
}

function collectKeywords(tokenLines, langId) {
  const map = new Map();
  const KIND = { kw: '关键字', bi: '内置', ty: '类型', op: '运算符', tag: '标签', attr: '属性', prop: '属性' };
  const OP_WHITELIST = ['=', '==', '!=', '<=', '>=', '+', '-', '*', '/', '%', '**', '//', '+=', '-='];
  tokenLines.forEach((ts, idx) => {
    ts.forEach(([t, v]) => {
      if (!KIND[t]) return;
      if (t === 'op' && !OP_WHITELIST.includes(v)) return;
      if ((t === 'tag' || t === 'attr' || t === 'prop') && v.length < 1) return;
      const key = v;
      if (!map.has(key)) map.set(key, { term: v, type: t, count: 0, lines: [] });
      const it = map.get(key);
      it.count++;
      if (it.lines[it.lines.length - 1] !== idx + 1) it.lines.push(idx + 1);
    });
  });
  return [...map.values()]
    .map(it => Object.assign(it, { kind: KIND[it.type] }))
    .sort((a, b) => b.count - a.count || a.term.localeCompare(b.term));
}

function dictKey(langId) {
  if (langId === 'c' || langId === 'cpp') return 'c_cpp';
  if (langId === 'js') return 'js_ts';
  if (langId === 'html' || langId === 'css') return 'web';
  return langId;
}

function lookup(term, langId) {
  const ld = DICT[dictKey(langId)] || {};
  if (ld[term]) return ld[term];
  if (DICT.common[term]) return DICT.common[term];
  const lower = term.toLowerCase();
  for (const k in ld) if (k.toLowerCase() === lower) return ld[k];
  for (const k in DICT.common) if (k.toLowerCase() === lower) return DICT.common[k];
  return null;
}

function hash32(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return h.toString(36);
}

function doExplain(quiet) {
  const code = $('code').value;
  if (!code.trim()) {
    lastResult = null;
    $('tab-overall').innerHTML = '<div class="empty">代码是空的，先粘一段进来。</div>';

    setFilterCounts(0, 0);

  const auto = $('lang').value === 'auto';

  lastResult = analyze(code, langId);
  lastResult.autoLang = auto;
  lastResult.candidates = det ? det.candidates : [];
  lastResult.confident = det ? det.confident : true;
  renderAll(lastResult);
  updateLangChip(lastResult);
  histRecordCode(code, langId);
