<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代码解释器">
<title>代码解释器</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1f2328; --muted: #6b7280;
    --border: #e3e6ea; --accent: #2563eb; --accent-soft: #e8f0fe;
    --code-bg: #1e1e1e; --code-text: #d4d4d4;
    --kw: #569cd6; --bi: #dcdcaa; --ty: #4ec9b0; --str: #ce9178;
    --com: #6a9955; --num: #b5cea8; --op: #d4d4d4; --tag: #569cd6; --attr: #9cdcfe;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
    --mono: Consolas, "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #58a6ff; --accent-soft: #1f2d3d;
      --code-bg: #0d1117; --code-text: #d4d4d4; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ============ 外壳 ============ */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; height: var(--vvh, 100dvh); overflow: hidden; }

  .appbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 12px 6px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: relative; z-index: 6;
  }
  .appbar .title {
    font-size: 16px; font-weight: 700; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .appbar .spacer { flex: 1 1 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px;
    border-radius: 17px; border: 1px solid var(--border); background: var(--panel);
    font-size: 13px; white-space: nowrap;
  }
  select.chip {
    appearance: none; -webkit-appearance: none; padding-right: 26px; max-width: 128px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 15px, calc(100% - 9px) 15px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .chip.ai { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.ai.off { border-color: var(--border); color: var(--muted); font-weight: 400; }
  .icon-btn {
    width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); display: inline-flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1; padding: 0;
  }

  /* ============ 视图区 ============ */
  .views { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; min-width: 0; }
  .view.active { display: flex; }
  #results { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
  #results.active { display: flex; }
  #results .view { position: absolute; inset: 0; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 12px; }

  /* ============ 代码屏 ============ */
  .editor-wrap { flex: 1 1 auto; display: flex; min-height: 0; background: var(--code-bg); }
  .gutter {
    flex: 0 0 auto; width: 44px; overflow: hidden; padding: 12px 8px 12px 4px;
    text-align: right; color: #6e7681; font-family: var(--mono); font-size: 14px;
    line-height: 1.6; white-space: pre; user-select: none;
    border-right: 1px solid rgba(255,255,255,.08);
  }
  #code {
    flex: 1 1 auto; min-width: 0; border: 0; outline: 0; resize: none;
    background: var(--code-bg); color: var(--code-text);
    font-family: var(--mono); font-size: 14px; line-height: 1.6;
    padding: 12px; tab-size: 4; white-space: pre; overflow: auto;
  }
  #code::placeholder { color: #6e7681; }
  .cta {
    flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 12px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .cta .btn { height: 46px; border-radius: 12px; font-size: 15px; }
  .cta .btn.primary { flex: 1 1 auto; }

  /* ============ 底部导航 ============ */
  .tabbar {
    flex: 0 0 auto; display: flex; background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom); position: relative; z-index: 6;
  }
  .tabbar button {
    flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 0 5px; border: 0; background: transparent; color: var(--muted); font-size: 11px;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ============ 通用按钮 ============ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 38px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--panel); font-size: 14px;
  }
  .btn:active { filter: brightness(.95); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.small { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .5; }

  /* ============ 结果内容 ============ */
  .filters {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center; overflow-x: auto;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .filters button {
    height: 32px; padding: 0 12px; border-radius: 16px; white-space: nowrap;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 13px;
  }
  .filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .summary-card { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 14.5px; }
  .summary-card b { color: var(--accent); }
  h3.sec { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 8px; letter-spacing: .5px; }
  ul.steps { margin: 0; padding-left: 22px; }
  ul.steps li { margin: 4px 0; }
  .func-list { display: flex; flex-direction: column; gap: 6px; }
  .func-item {
    display: flex; gap: 8px; align-items: baseline; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .func-item .ln { color: var(--muted); font-size: 12px; min-width: 52px; flex: 0 0 auto; }
  .func-item code { font-family: var(--mono); color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: 14px; }

  .line-card { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; background: var(--panel); }
  .line-card.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .line-card .code-row {
    display: flex; background: var(--code-bg); color: var(--code-text);
    font-family: var(--mono); font-size: 13px; line-height: 1.7; overflow-x: auto; white-space: pre;
  }
  .line-card .lineno {
    flex: 0 0 auto; width: 40px; text-align: right; padding: 6px 8px 6px 6px;
    color: #6e7681; user-select: none; border-right: 1px solid #333;
  }
  .line-card .code-body { padding: 6px 10px; }
  .line-card .note { padding: 8px 12px; font-size: 13.5px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
  .line-card .note .tag {
    flex: 0 0 auto; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .note .fallback { color: var(--muted); }

  .tok-k, .tok-kw { color: var(--kw); } .tok-bi { color: var(--bi); } .tok-ty { color: var(--ty); }
  .tok-str { color: var(--str); } .tok-com { color: var(--com); font-style: italic; }
  .tok-num { color: var(--num); } .tok-op { color: var(--op); }
  .tok-tag { color: var(--tag); } .tok-attr, .tok-prop { color: var(--attr); }
  .tok-sel { color: var(--kw); } .tok-plain { color: var(--code-text); }

  .kw-list { display: flex; flex-direction: column; gap: 8px; }
  .kw-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--panel); }
  .kw-item:active { background: var(--accent-soft); }
  .kw-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kw-head code { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .kw-head .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .kw-head .zh { font-size: 14px; }
  .kw-head .cnt { font-size: 12px; color: var(--muted); margin-left: auto; }
  .kw-jump {
    display: inline-flex; align-items: center; height: 24px; padding: 0 8px; margin: 2px 4px 2px 0;
    border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
    font-size: 12px; color: var(--accent); font-family: var(--mono);
  }
  .kw-body { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .kw-item.open .kw-body { display: block; }
  .kw-body p { margin: 4px 0; font-size: 13.5px; }
  .kw-body pre {
    background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 8px 10px;
    font-family: var(--mono); font-size: 12.5px; overflow-x: auto; margin: 6px 0; white-space: pre;
  }
  .kw-body a { color: var(--accent); font-size: 13px; }
  .kw-miss { color: var(--muted); font-size: 13px; }

  /* ============ AI ============ */
  .ai-block { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .ai-head b { font-size: 13px; color: var(--accent); }
  .ai-head .spacer { flex: 1; }
  .ai-out { padding: 10px 12px; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .ai-out:empty { display: none; }
  .ai-note { padding: 8px 12px; color: var(--muted); font-size: 13px; }
  .ai-err { color: #d1242f; }
  .ai-cursor { color: var(--accent); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .ai-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 12px 10px; }
  .ai-chat { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 0; }
  .ai-msg { font-size: 14px; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .ai-msg.me { background: var(--accent-soft); align-self: flex-end; max-width: 88%; }
  .ai-msg.ai { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; max-width: 92%; }
  .ask-row { display: flex; gap: 8px; padding: 10px 12px 12px; }
  .ask-row input {
    flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); font-size: 14px;
  }

  /* ============ 抽屉 / 遮罩 ============ */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    max-height: 86vh; overflow-y: auto; box-shadow: 0 -8px 28px rgba(0,0,0,.25);
  }
  .sheet h3 { margin: 0 0 8px; font-size: 15px; }
  .sheet .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field select {
    height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); font-size: 14px; width: 100%;
  }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; margin-bottom: 6px; }
  .switch-row span { font-size: 14px; }
  .switch-row input { width: 20px; height: 20px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions .btn { flex: 1 1 auto; }
  .menu-item {
    display: block; width: 100%; text-align: left; padding: 13px 4px;
    border: 0; border-bottom: 1px solid var(--border); background: transparent; font-size: 15px;
  }
  .menu-item:last-child { border-bottom: 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(28,28,30,.94); color: #fff; font-size: 13px; padding: 8px 14px;
    border-radius: 18px; opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 40;
    max-width: 84vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ============ 桌面 ============ */
  .desktop-tabs { display: none; }
  @media (min-width: 900px) {
    .views { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px; }
    #view-code {
      position: static; display: flex; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: var(--shadow); background: var(--panel);
    }
    #results {
      position: static; display: flex; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; box-shadow: var(--shadow); background: var(--panel);
    }
    #results .view { position: static; inset: auto; }
    .tabbar { display: none; }
    .cta { border-top: 1px solid var(--border); }
    .desktop-tabs {
      display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--border);
      background: var(--panel); flex: 0 0 auto;
    }
    .desktop-tabs button {
      height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent;
      border-radius: 0; background: transparent; color: var(--muted); font-size: 14px;
    }
    .desktop-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    #code { font-size: 13.5px; }
    .gutter { font-size: 13.5px; }
    .toast { bottom: 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="title" id="barTitle">代码解释器</div>
    <div class="spacer"></div>
    <select id="lang" class="chip" aria-label="语言">
      <option value="auto">自动识别</option>
      <option value="python">Python</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="js">JavaScript</option>
      <option value="sql">SQL</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
    </select>
    <button id="btnAiChip" class="chip ai off" aria-label="AI 通道">AI</button>
    <button id="btnMore" class="icon-btn" aria-label="更多" aria-haspopup="menu">⋯</button>
  </header>

  <main class="views">
    <section id="view-code" class="view active">
      <div class="editor-wrap">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"
          placeholder="把代码粘进来，然后点下面的「解释」"></textarea>
      </div>
      <div class="cta">
        <button id="btnPaste" class="btn">粘贴</button>
        <button id="btnExplain" class="btn primary">解释</button>
      </div>
    </section>

    <section id="results">
      <nav class="desktop-tabs" id="resultTabs">
        <button data-view="overall" class="active">整体</button>
        <button data-view="lines">逐行</button>
        <button data-view="words">词表</button>
      </nav>

      <section id="view-overall" class="view active">
        <div class="scroll" id="overallScroll">
          <div id="tab-overall"><div class="empty">点「解释」看这段代码在干什么。</div></div>
          <div id="aiOverall"></div>
        </div>
      </section>

      <section id="view-lines" class="view">
        <div class="filters">
          <button data-filter="all" class="active">全部</button>
          <button data-filter="noted">只看有说明</button>
          <button id="btnAiLines" class="btn small">AI 补全没讲的行</button>
        </div>
        <div class="scroll" id="linesScroll"><div id="tab-lines"><div class="empty">还没解释。</div></div></div>
      </section>

      <section id="view-words" class="view">
        <div class="scroll" id="wordsScroll"><div id="tab-keywords"><div class="empty">还没解释。</div></div></div>
      </section>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="code" class="active" aria-label="代码">
      <svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M15 7l5 5-5 5"/></svg>
      <span>代码</span>
    </button>
    <button data-view="overall" aria-label="整体">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span>整体</span>
    </button>
    <button data-view="lines" aria-label="逐行">
      <svg viewBox="0 0 24 24"><path d="M9 7h11"/><path d="M9 12h11"/><path d="M9 17h11"/><path d="M4 7h.01"/><path d="M4 12h.01"/><path d="M4 17h.01"/></svg>
      <span>逐行</span>
    </button>
    <button data-view="words" aria-label="词表">
      <svg viewBox="0 0 24 24"><path d="M20 12.5l-7.5 7.5L3 10.5V3h7.5z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
      <span>词表</span>
    </button>
  </nav>
</div>

<div class="mask" id="mask" hidden></div>

<div class="sheet" id="sheetMore" hidden>
  <button class="menu-item" id="miPaste">粘贴剪贴板</button>
  <button class="menu-item" id="miCopy">复制代码</button>
  <button class="menu-item" id="miClear">清空代码</button>
  <button class="menu-item" id="miSettings">设置 / AI 通道</button>
  <button class="menu-item" id="miAbout">关于</button>
</div>

<div class="sheet" id="sheetSettings" hidden>
  <h3>设置</h3>
  <label class="switch-row">
    <span>启用 AI 通道</span>
    <input type="checkbox" id="aiOn">
  </label>
  <p class="hint">开启后，代码会发送到 DeepSeek 的服务器做讲解。关掉就是纯离线解释，一个字都不上传。</p>
  <div class="field">
    <label>API Key（只存在这台设备上）</label>
    <input id="aiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>接口地址</label>
    <input id="aiBase" placeholder="https://api.deepseek.com" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label>模型</label>
    <select id="aiModel">
      <option value="deepseek-flash">deepseek-flash（快、便宜）</option>
      <option value="deepseek-v4-pro">deepseek-v4-pro（讲得更细，更贵）</option>
    </select>
  </div>
  <p class="hint" id="aiUsage"></p>
  <div class="sheet-actions">
    <button class="btn" id="aiClear">清掉 Key</button>
    <button class="btn" id="aiClearCache">清 AI 缓存</button>
    <button class="btn primary" id="aiSave">保存</button>
  </div>
  <p class="hint" id="verText"></p>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 词典 ================= */
const DICT = {
common: {
  'if': {zh:'如果', d:'条件判断：条件成立才执行跟着的代码块。', ex:'if x > 0:\n    print("正数")'},
  'else': {zh:'否则', d:'和 if 搭配：上面的条件都不成立时走这里。', ex:'if x > 0:\n    print("正")\nelse:\n    print("负")'},
  'for': {zh:'循环', d:'按次数或按集合里的元素重复执行。', ex:'for i in range(3):\n    print(i)'},
  'while': {zh:'当……时循环', d:'条件为真就一直重复，条件变假才停。', ex:'while n > 0:\n    n -= 1'},

/* ================= 语言识别 ================= */
function detectLanguage(code) {

  const has = (re) => re.test(code);
  if (has(/#\s*include\s*<(iostream|vector|string|algorithm)>/) || has(/\bstd::/) || has(/\bcout\s*<</) || has(/\bclass\s+\w+\s*\{[\s\S]*\bpublic\s*:/)) s.cpp += 7;
  if (has(/#\s*include\s*</) || has(/#\s*define\s+\w+/)) { s.c += 5; s.cpp += 3; }
  if (has(/\bpublic\s+static\s+void\s+main\s*\(/) || has(/\bSystem\.out\./) || has(/\bpublic\s+class\b/)) s.java += 7;
  if (has(/^\s*(def|class)\s+\w+.*:\s*$/m) || has(/^\s*(import|from)\s+[\w.]+/m) || has(/\bprint\s*\(/) || has(/^\s*for\s+\w+\s+in\s+/m)) s.python += 4;
  if (has(/^\s*(const|let|var)\s+\w+/m) || has(/=>/) || has(/\bconsole\.log\s*\(/) || has(/\bfunction\s+\w*\s*\(/)) s.js += 4;
  if (has(/\b(SELECT|INSERT|UPDATE|DELETE|CREATE)\b[\s\S]*\b(FROM|INTO|TABLE|SET|VALUES)\b/i)) s.sql += 8;
  if (has(/^\s*<(html|head|body|div|p|a|img|script|style|h1|ul|span)\b/im) || has(/<!DOCTYPE/i)) s.html += 8;
  if (has(/[.#]?[\w-]+\s*\{[^}]*:[^};]+;/)) s.css += 4;
  if (has(/^\s*<[a-zA-Z!\/]/m) && has(/<\/[a-zA-Z]/)) s.html += 2;
  const best = Object.entries(s).sort((a, b) => b[1] - a[1])[0];
  return best[1] <= 0 ? 'python' : best[0];
}

/* ================= 分词器 ================= */
function pushTok(lines, type, text) {
  const parts = String(text).split('\n');
  parts.forEach((p, idx) => {
    if (idx > 0) lines.push([]);
    if (p) lines[lines.length - 1].push([type, p]);
  });
}

function scanClike(src, cfg) {
  const lines = [[]];
  const kwSet = new Set(cfg.kw), biSet = new Set(cfg.bi), tySet = new Set(cfg.ty);
  const idStart = c => /[A-Za-z_$]/.test(c);
  const idChar = c => /[A-Za-z0-9_$]/.test(c);
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (cfg.block && src.startsWith(cfg.block[0], i)) {
      const end = src.indexOf(cfg.block[1], i + cfg.block[0].length);
      const stop = end === -1 ? n : end + cfg.block[1].length;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    const mstr = cfg.strings.find(s => s[2] && src.startsWith(s[0], i));
    if (mstr) {
      const end = src.indexOf(mstr[1], i + mstr[0].length);
      const stop = end === -1 ? n : end + mstr[1].length;
      pushTok(lines, 'str', src.slice(i, stop)); i = stop; continue;
    }
    const lc = cfg.lineComments.find(l => src.startsWith(l, i));
    if (lc) {
      let end = src.indexOf('\n', i);
      if (end === -1) end = n;
      pushTok(lines, 'com', src.slice(i, end)); i = end; continue;
    }
    const st = cfg.strings.find(s => !s[2] && src.startsWith(s[0], i));
    if (st) {
      let j = i + st[0].length;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src.startsWith(st[1], j)) { j += st[1].length; break; }
        if (src[j] === '\n') break;
        j++;
      }
      pushTok(lines, 'str', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c) || (c === '.' && /\d/.test(src[i + 1] || ''))) {
      let j = i;
      while (j < n && /[0-9A-Fa-fxX._]/.test(src[j])) j++;
      pushTok(lines, 'num', src.slice(i, j)); i = j; continue;
    }
    if (idStart(c)) {
      let j = i;
      while (j < n && idChar(src[j])) j++;
      const w = src.slice(i, j);
      const lw = w.toLowerCase();
      let t = 'plain';
      if (kwSet.has(w) || kwSet.has(lw)) t = 'kw';
      else if (biSet.has(w) || biSet.has(lw)) t = 'bi';
      else if (tySet.has(w) || tySet.has(lw)) t = 'ty';
      pushTok(lines, t, w); i = j; continue;
    }
    const op = opsSorted.find(o => src.startsWith(o, i));
    if (op) { pushTok(lines, 'op', op); i += op.length; continue; }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function scanSQL(src) {
  const cfg = LANGS.sql;
  const lines = [[]];
  const kwSet = new Set(cfg.kw.map(k => k.toLowerCase()));
  const biSet = new Set(cfg.bi.map(k => k.toLowerCase()));
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('--', i)) {
      let end = src.indexOf('\n', i);
      if (end === -1) end = n;
      pushTok(lines, 'com', src.slice(i, end)); i = end; continue;
    }
    if (src.startsWith('/*', i)) {
      const end = src.indexOf('*/', i + 2);
      const stop = end === -1 ? n : end + 2;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === "'" || c === '"') {
      let j = i + 1;
      while (j < n) {
        if (src[j] === c) { j++; break; }
        if (src[j] === '\n') break;
        j++;
      }
      pushTok(lines, 'str', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c)) {
      let j = i; while (j < n && /[0-9.]/.test(src[j])) j++;
      pushTok(lines, 'num', src.slice(i, j)); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j), lw = w.toLowerCase();
      let t = 'plain';
      if (kwSet.has(lw)) t = 'kw';
      else if (biSet.has(lw)) t = 'bi';
      else if (new Set(cfg.ty.map(x => x.toLowerCase())).has(lw)) t = 'ty';
      pushTok(lines, t, w); i = j; continue;
    }
    const op = opsSorted.find(o => src.startsWith(o, i));
    if (op) { pushTok(lines, 'op', op); i += op.length; continue; }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function scanHTML(src) {
  const lines = [[]];
  const tags = new Set(Object.keys(DICT.web));
  let i = 0, n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('<!--', i)) {
      const end = src.indexOf('-->', i);
      const stop = end === -1 ? n : end + 3;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === '<') {
      const end = src.indexOf('>', i);
      const stop = end === -1 ? n : end + 1;
      const tagText = src.slice(i, stop);
      const m = tagText.match(/^<(\/?)\s*([a-zA-Z0-9-]+)/);
      if (m) {
        const lead = tagText.slice(0, m[0].length);
        pushTok(lines, 'plain', '<');
        if (m[1]) pushTok(lines, 'op', '/');
        pushTok(lines, tags.has(m[2].toLowerCase()) ? 'tag' : 'plain', m[2]);
        let rest = tagText.slice(m[0].length);
        const re = /(\s+)([a-zA-Z_:][\w:.-]*)(\s*=\s*)?("[^"]*"|'[^']*')?/g;
        let last = 0, mm;
        while ((mm = re.exec(rest)) !== null) {
          if (mm.index > last) pushTok(lines, 'plain', rest.slice(last, mm.index));
          if (mm[1]) pushTok(lines, 'plain', mm[1]);
          pushTok(lines, 'attr', mm[2]);
          if (mm[3]) pushTok(lines, 'op', mm[3]);
          if (mm[4]) pushTok(lines, 'str', mm[4]);
          last = re.lastIndex;
        }
        if (last < rest.length) pushTok(lines, 'plain', rest.slice(last));
      } else {
        pushTok(lines, 'plain', tagText);
      }
      i = stop; continue;
    }
    let j = i;
    while (j < n && src[j] !== '<' && src[j] !== '\n') j++;
    pushTok(lines, 'plain', src.slice(i, j)); i = j;
  }
  return lines;
}

function scanCSS(src) {
  const lines = [[]];
  let i = 0, n = src.length, mode = 'sel';
  while (i < n) {
    const c = src[i];
    if (c === '\n') { lines.push([]); i++; continue; }
    if (src.startsWith('/*', i)) {
      const end = src.indexOf('*/', i + 2);
      const stop = end === -1 ? n : end + 2;
      pushTok(lines, 'com', src.slice(i, stop)); i = stop; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && src[j] !== c && src[j] !== '\n') j++;
      pushTok(lines, 'str', src.slice(i, Math.min(j + 1, n))); i = Math.min(j + 1, n); continue;
    }
    if (c === '{') { pushTok(lines, 'op', '{'); mode = 'decl'; i++; continue; }
    if (c === '}') { pushTok(lines, 'op', '}'); mode = 'sel'; i++; continue; }
    if (c === ';') { pushTok(lines, 'op', ';'); i++; continue; }
    if (c === ':') { pushTok(lines, 'op', ':'); i++; continue; }
    if (mode === 'sel') {
      let j = i;
      while (j < n && !'{}\n'.includes(src[j]) && !src.startsWith('/*', j)) j++;
      pushTok(lines, 'sel', src.slice(i, j)); i = j; continue;
    }
    if (/[a-zA-Z-]/.test(c)) {
      let j = i;
      while (j < n && /[a-zA-Z-]/.test(src[j])) j++;
      let k = j;
      while (k < n && /\s/.test(src[k]) && src[k] !== '\n') k++;
      pushTok(lines, src[k] === ':' ? 'prop' : 'plain', src.slice(i, j)); i = j; continue;
    }
    if (/\d/.test(c) || c === '#') {
      let j = i + 1;
      while (j < n && /[0-9A-Fa-f%#]/.test(src[j])) j++;
      if (/[a-zA-Z]/.test(src[i] || '')) { pushTok(lines, 'plain', src.slice(i, j)); }
      else pushTok(lines, 'num', src.slice(i, j));
      i = j; continue;
    }
    pushTok(lines, 'plain', c); i++;
  }
  return lines;
}

function tokenizeAll(code, langId) {
  if (langId === 'html') return scanHTML(code);
  if (langId === 'css') return scanCSS(code);
  if (langId === 'sql') return scanSQL(code);
  return scanClike(code, LANGS[langId]);
}

const TAG_LABEL = {

  return:'返回', call:'调用', with:'资源', try:'异常处理', jump:'跳出',

};

function rangeDesc(args) {
  if (args.length === 1) return '从 0 到 ' + (parseInt(args[0], 10) - 1) + '，共 ' + args[0] + ' 次';
  if (args.length === 2) return '从 ' + args[0] + ' 到 ' + args[1] + '-1';
  if (args.length === 3) return '从 ' + args[0] + ' 到 ' + args[1] + '-1，每步 +' + args[2];
  return '';
}

function pyRule(s) {
  let m;
  if (/^#/.test(s)) return { note: '注释：' + s.replace(/^#+\s*/, ''), tag: 'comment' };
  if (/^("""|''')/.test(s)) return { note: '文档字符串（三引号里的说明文字，不算代码逻辑）', tag: 'comment' };
  if ((m = s.match(/^from\s+([\w.]+)\s+import\s+(.+)$/))) return { note: '从模块 ' + m[1] + ' 中导入：' + m[2], tag: 'import' };
  if ((m = s.match(/^import\s+(.+)$/))) return { note: '导入模块：' + m[1].replace(/\s+as\s+/g, '，并重命名为 '), tag: 'import' };
  if ((m = s.match(/^def\s+(\w+)\s*\((.*?)\)\s*(?:->\s*([^{]+?))?\s*:/))) return { note: '定义函数 ' + m[1] + '，参数：' + (m[2] || '无') + (m[3] ? '，返回类型 ' + m[3].trim() : ''), tag: 'func' };
  if ((m = s.match(/^class\s+(\w+)\s*(?:\((.*?)\))?\s*:/))) return { note: '定义类 ' + m[1] + (m[2] ? '，继承自 ' + m[2] : ''), tag: 'class' };
  if ((m = s.match(/^@(\w+)/))) return { note: '装饰器 @' + m[1] + '：给下面的函数/类附加功能', tag: 'decorator' };
  if ((m = s.match(/^if\s+(.+?)\s*:$/))) return { note: '如果 ' + m[1] + ' 成立，就执行下面的代码块', tag: 'cond' };
  if ((m = s.match(/^elif\s+(.+?)\s*:$/))) return { note: '否则如果 ' + m[1] + ' 成立，就执行下面的代码块', tag: 'cond' };
  if ((m = s.match(/^else\s*:$/))) return { note: '否则：上面条件都不成立时执行', tag: 'cond' };
  if ((m = s.match(/^for\s+(.+?)\s+in\s+range\s*\((.*?)\)\s*:$/))) return { note: '循环 ' + m[1] + '：' + rangeDesc(m[2].split(',').map(x => x.trim())), tag: 'loop' };
  if ((m = s.match(/^for\s+(.+?)\s+in\s+(.+?)\s*:$/))) return { note: '循环：' + m[1] + ' 依次取 ' + m[2] + ' 里的每个元素', tag: 'loop' };
  if ((m = s.match(/^while\s+(.+?)\s*:$/))) return { note: '只要 ' + m[1] + ' 为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^return\b\s*(.*)$/))) return { note: m[1] ? '返回 ' + m[1] : '返回（结束函数，不返回值）', tag: 'return' };
  if ((m = s.match(/^print\s*\((.*)\)\s*$/))) return { note: '输出：' + m[1], tag: 'output' };
  if ((m = s.match(/^input\s*\((.*)\)\s*$/))) return { note: '等待用户输入' + (m[1] ? '，提示语：' + m[1] : ''), tag: 'input' };
  if ((m = s.match(/^with\s+(.+?)\s+as\s+(\w+)\s*:/))) return { note: '打开 ' + m[1] + '，用变量 ' + m[2] + ' 引用，离开代码块时自动关闭', tag: 'with' };

  if ((m = s.match(/^except\s*(.*?)\s*:/))) return { note: '捕获异常' + (m[1] ? '：' + m[1] : '（任意异常）'), tag: 'try' };

  if (/^pass\b/.test(s)) return { note: '占位：什么都不做', tag: 'stmt' };

  if ((m = s.match(/^(\w+)\s*\(.*\);/))) return { note: '调用函数 ' + m[1] + '(...)', tag: 'call' };
  if (/^break\b/.test(s)) return { note: '跳出当前循环', tag: 'jump' };
  if (/^continue\b/.test(s)) return { note: '跳过本次循环剩下的部分', tag: 'jump' };
  return null;
}

function javaRule(s) {
  let m;
  if (/^\/\//.test(s)) return { note: '注释：' + s.replace(/^\/+\s*/, ''), tag: 'comment' };
  if (/^\/\*/.test(s)) return { note: '块注释开始', tag: 'comment' };
  if (/^\}/.test(s)) return { note: '代码块结束', tag: 'stmt' };
  if (/^\{/.test(s)) return { note: '代码块开始', tag: 'stmt' };
  if ((m = s.match(/^package\s+([\w.]+);/))) return { note: '声明当前文件属于包 ' + m[1], tag: 'import' };
  if ((m = s.match(/^import\s+(.+);/))) return { note: '导入 ' + m[1], tag: 'import' };
  if (/^public\s+class\s+(\w+)/.test(s)) return { note: '定义公开类 ' + s.match(/class\s+(\w+)/)[1] + '，类名要和文件名一致', tag: 'class' };
  if ((m = s.match(/^public\s+static\s+void\s+main\s*\(/))) return { note: '程序入口 main 方法：Java 程序从这里开始执行', tag: 'func' };
  if (/^@Override/.test(s)) return { note: '注解 @Override：表示这是重写父类的方法', tag: 'decorator' };
  if ((m = s.match(/^(public|private|protected)?\s*(static)?\s*(void|int|double|float|long|boolean|char|String|List|Map)\s+(\w+)\s*\(/))) return { note: '定义方法 ' + m[4] + '，返回 ' + m[3], tag: 'func' };
  if ((m = s.match(/^(int|double|float|long|boolean|char|byte|short|String|var)\s+(\w+)\s*(=.*)?;/))) return { note: '声明 ' + m[1] + ' 变量 ' + m[2] + (m[3] ? '，并赋初值 ' + m[3].replace(/^=\s*/, '') : ''), tag: 'assign' };
  if ((m = s.match(/^System\.out\.(println|print|printf)\s*\(/))) return { note: m[1] === 'println' ? '打印一行并换行' : '打印内容（不换行）', tag: 'output' };
  if ((m = s.match(/^Scanner\s+\w+\s*=\s*new\s+Scanner\s*\(/))) return { note: '创建 Scanner 对象，准备读取控制台输入', tag: 'input' };
  if ((m = s.match(/^for\s*\((.*)\)/))) return { note: 'for 循环：' + (m[1].includes(':') ? '遍历集合里的每个元素' : '按三段式控制循环次数'), tag: 'loop' };
  if ((m = s.match(/^while\s*\((.*)\)/))) return { note: '只要「' + m[1] + '」为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^if\s*\((.*)\)/))) return { note: '如果「' + m[1] + '」成立，执行下面的代码块', tag: 'cond' };
  if (/^else\b/.test(s)) return { note: '否则：上面条件不成立时执行', tag: 'cond' };
  if ((m = s.match(/^return\b\s*(.*?);?$/))) return { note: m[1] ? '返回 ' + m[1] : '返回', tag: 'return' };
  if ((m = s.match(/^try\s*\{/))) return { note: '尝试执行下面的代码（可能出错）', tag: 'try' };
  if ((m = s.match(/^catch\s*\((.*?)\)/))) return { note: '捕获异常：' + m[1], tag: 'try' };
  if ((m = s.match(/^(\w+)\s*=(?!=)\s*(.+);$/))) return { note: '把「' + m[2] + '」赋给 ' + m[1], tag: 'assign' };
  if ((m = s.match(/^(\w+)\s*\(.*\);/))) return { note: '调用方法 ' + m[1] + '(...)', tag: 'call' };
  return null;
}

function jsRule(s) {
  let m;
  if (/^\/\//.test(s)) return { note: '注释：' + s.replace(/^\/+\s*/, ''), tag: 'comment' };
  if (/^\/\*/.test(s)) return { note: '块注释开始', tag: 'comment' };
  if (/^\}/.test(s)) return { note: '代码块结束', tag: 'stmt' };
  if (/^\{/.test(s)) return { note: '代码块开始', tag: 'stmt' };
  if ((m = s.match(/^(const|let|var)\s+(\w+)\s*=\s*(.+?);?$/))) return { note: '声明' + (m[1] === 'const' ? '常量' : '变量') + ' ' + m[2] + '，初始值「' + m[3] + '」', tag: 'assign' };
  if ((m = s.match(/^function\s+(\w+)\s*\(([^)]*)\)/))) return { note: '定义函数 ' + m[1] + '，参数：' + (m[2] || '无'), tag: 'func' };
  if ((m = s.match(/^(const|let|var)\s+(\w+)\s*=\s*\(([^)]*)\)\s*=>/))) return { note: '定义箭头函数 ' + m[2] + '，参数：' + (m[3] || '无'), tag: 'func' };
  if (/^console\.(log|error|warn)\s*\(/.test(s)) return { note: '在控制台输出' + (s.match(/^console\.(\w+)/)[1] === 'log' ? '' : '（' + s.match(/^console\.(\w+)/)[1] + '）'), tag: 'output' };
  if ((m = s.match(/^for\s*\((.*)\)/))) return { note: 'for 循环：' + (m[1].includes('of') || m[1].includes('in') ? '遍历数组/对象的每个元素' : '按三段式控制循环次数'), tag: 'loop' };
  if ((m = s.match(/^while\s*\((.*)\)/))) return { note: '只要「' + m[1] + '」为真就重复执行', tag: 'loop' };
  if ((m = s.match(/^if\s*\((.*)\)/))) return { note: '如果「' + m[1] + '」成立，执行下面的代码块', tag: 'cond' };
  if (/^else\b/.test(s)) return { note: '否则：上面条件不成立时执行', tag: 'cond' };
  if ((m = s.match(/^return\b\s*(.*?);?$/))) return { note: m[1] ? '返回 ' + m[1] : '返回', tag: 'return' };
  if ((m = s.match(/^import\s+(.+?)\s+from\s+(.+?);?$/))) return { note: '从 ' + m[2] + ' 导入 ' + m[1], tag: 'import' };
  if ((m = s.match(/^export\s+default\s+(.+)$/))) return { note: '默认导出：' + m[1], tag: 'import' };
  if ((m = s.match(/^export\s+(.+)$/))) return { note: '导出：' + m[1], tag: 'import' };
  if ((m = s.match(/^(\w+(?:\.\w+)*)\s*=(?!=)\s*(.+);?$/))) return { note: '把「' + m[2] + '」赋给 ' + m[1], tag: 'assign' };
  if ((m = s.match(/^(\w+(?:\.\w+)*)\s*\(.*\)\s*;?$/))) return { note: '调用 ' + m[1] + '(...)', tag: 'call' };
  return null;
}

function sqlRule(s) {
  const u = s.toUpperCase();
  if (u.startsWith('--')) return { note: '注释：' + s.replace(/^--+\s*/, ''), tag: 'comment' };
  if (/^\s*SELECT\b/.test(u)) {
    let note = '查询：取 ';
    const cols = s.match(/SELECT\s+([\s\S]*?)(?:\s+FROM\b|$)/i);
    if (cols) {
      note += (cols[1].trim() === '*' ? '所有列' : '列 ' + cols[1].trim());
      const tb = s.match(/FROM\s+(\w+)/i);
      if (tb) note += '，来自表 ' + tb[1];
    } else note += '数据';
    return { note: note, tag: 'sql' };
  }
  if (/^\s*INSERT\b/.test(u)) {
    const tb = s.match(/INTO\s+(\w+)/i);
    return { note: '插入：往' + (tb ? '表 ' + tb[1] : '表') + '里加一行新数据', tag: 'sql' };
  }
  if (/^\s*UPDATE\b/.test(u)) {
    const tb = s.match(/UPDATE\s+(\w+)/i), st = s.match(/SET\s+([\s\S]*?)\s+WHERE\b/i);
    return { note: '更新：改' + (tb ? '表 ' + tb[1] : '表') + (st ? '里的 ' + st[1].trim() : '') + '（WHERE 指定改哪些行）', tag: 'sql' };
  }
  if (/^\s*DELETE\b/.test(u)) {
    const tb = s.match(/FROM\s+(\w+)/i);
    return { note: '删除：从' + (tb ? '表 ' + tb[1] : '表') + '里删掉满足 WHERE 条件的行', tag: 'sql' };
  }
  if (/^\s*CREATE\s+TABLE\b/.test(u)) {
    const tb = s.match(/CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(\w+)/i);
    return { note: '建表：新建' + (tb ? '表 ' + tb[1] : '一张表') + '，括号里是列名和类型', tag: 'sql' };
  }
  if (/^\s*FROM\s+(\w+)/.test(u)) {
    const tb = s.match(/FROM\s+(\w+)/i);
    return { note: '从表 ' + tb[1] + ' 里取数据', tag: 'sql' };
  }
  if (/^\s*(GROUP\s+BY|ORDER\s+BY|HAVING|WHERE|LIMIT|JOIN|ON|VALUES|SET)\b/.test(u)) return { note: 'SQL 子句：' + s.replace(/;$/, ''), tag: 'sql' };
  return null;
}

function htmlRule(s) {
  if (/^<!--/.test(s)) return { note: 'HTML 注释', tag: 'comment' };
  let m;
  if ((m = s.match(/^<(\/?)([a-zA-Z0-9-]+)/))) {
    const info = DICT.web[m[2].toLowerCase()];
    if (m[1]) return { note: (info ? info.zh + ' ' : '') + '标签结束：</' + m[2] + '>', tag: 'tag' };
    return { note: (info ? '开始' + info.zh + '：' : '开始标签：') + '<' + m[2] + '>' + (info ? '（' + info.d + '）' : ''), tag: 'tag' };
  }
  if (s.trim()) return { note: '页面上的文字内容', tag: 'text' };
  return null;
}

function cssRule(s) {
  if (/^\/\*/.test(s)) return { note: '注释', tag: 'comment' };
  let m;
  if ((m = s.match(/^([^{}]+)\{\s*$/))) return { note: '选择器「' + m[1].trim() + '」：给匹配的元素设置样式', tag: 'prop' };
  if (/^\}/.test(s)) return { note: '样式块结束', tag: 'prop' };
  if ((m = s.match(/^([\w-]+)\s*:\s*(.+?);?$/))) {
    const key = m[1].toLowerCase();
    const info = DICT.web[key];
    return { note: (info ? info.zh + '：' : '') + m[1] + ' = ' + m[2].replace(/;$/, ''), tag: 'prop' };
  }
  return null;
}

const RULE_FN = { python: pyRule, c: cRule, cpp: cRule, java: javaRule, js: jsRule, sql: sqlRule, html: htmlRule, css: cssRule };

function explainLine(text, langId) {
  const s = text.trim();
  if (!s) return { note: '', tag: 'blank' };
  const fn = RULE_FN[langId];
  const r = fn ? fn(s) : null;
  if (r) return r;
  return { note: '这行执行：' + s, tag: 'stmt', fallback: true };
}

/* ================= 整体解释与关键字 ================= */
const STEP_TEXT = {
  import: '导入需要的模块/头文件', func: '定义函数', 'class': '定义类', input: '读取用户输入',
  output: '输出结果', loop: '循环处理', cond: '做条件判断', assign: '给变量赋值',
  return: '返回结果', call: '调用函数/方法', with: '打开并管理资源', try: '处理异常',
  jump: '中断/跳过循环', sql: '执行 SQL 操作', tag: '编写页面结构', prop: '设置样式'
};

function analyze(rawCode, langId) {
  const tokenLines = tokenizeAll(rawCode, langId);
  const lineTexts = tokenLines.map(ts => ts.map(t => t[1]).join(''));
  const lineNotes = lineTexts.map(t => explainLine(t, langId));
  const stats = {
    total: lineTexts.length,
    code: lineTexts.filter(t => t.trim()).length,
    blank: lineTexts.filter(t => !t.trim()).length
  };
  const funcs = [], classes = [];
  lineTexts.forEach((t, idx) => {
    const s = t.trim();
    let m;
    if (langId === 'python' && (m = s.match(/^def\s+(\w+)\s*\(([^)]*)\)/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: 'def ' + m[1] + '(' + m[2] + ')' });
    else if (langId === 'java' && (m = s.match(/(?:public|private|protected)?\s*(?:static\s+)?(?:void|int|double|boolean|String)\s+(\w+)\s*\(([^)]*)\)\s*\{?$/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: m[1] + '(' + m[2] + ')' });
    else if ((langId === 'c' || langId === 'cpp') && (m = s.match(/^(int|void|char|float|double|bool|long)\s+(\w+)\s*\(([^;]*)\)\s*\{?$/))) funcs.push({ name: m[2], args: m[3], line: idx + 1, sig: m[1] + ' ' + m[2] + '(' + m[3] + ')' });
    else if (langId === 'js' && (m = s.match(/^function\s+(\w+)\s*\(([^)]*)\)/))) funcs.push({ name: m[1], args: m[2], line: idx + 1, sig: 'function ' + m[1] + '(' + m[2] + ')' });
    if ((m = s.match(/^class\s+(\w+)/))) classes.push({ name: m[1], line: idx + 1 });
  });
  const tags = lineNotes.map(n => n.tag).filter(t => t !== 'blank' && t !== 'comment' && t !== 'return');
  const steps = [];
  tags.forEach(t => {
    if (!STEP_TEXT[t]) return;
    if (!steps.includes(STEP_TEXT[t])) steps.push(STEP_TEXT[t]);
  });
  const summaryParts = [];
  summaryParts.push('这段 ' + langLabel(langId) + ' 代码共 ' + stats.total + ' 行，其中有效代码 ' + stats.code + ' 行。');
  if (classes.length) summaryParts.push('定义了 ' + classes.length + ' 个类：' + classes.map(c => c.name).join('、') + '。');
  if (funcs.length) summaryParts.push('定义了 ' + funcs.length + ' 个函数：' + funcs.map(f => f.name).join('、') + '。');
  if (steps.length) summaryParts.push('主要流程是：' + steps.join(' → ') + '。');
  return {
    lang: langId,
    stats,
    summary: summaryParts.join(''),
    steps: steps,
    funcs,
    classes,
    lineTexts,
    lineNotes,
    tokenLines,
    keywords: collectKeywords(tokenLines, langId)
  };
}

function collectKeywords(tokenLines, langId) {
  const map = new Map();
  const KIND = { kw: '关键字', bi: '内置', ty: '类型', op: '运算符', tag: '标签', attr: '属性', prop: '属性' };
  const OP_WHITELIST = ['=', '==', '!=', '<=', '>=', '+', '-', '*', '/', '%', '**', '//', '+=', '-='];
  tokenLines.forEach((ts, idx) => {
    ts.forEach(([t, v]) => {
      if (!KIND[t]) return;
      if (t === 'op' && !OP_WHITELIST.includes(v)) return;
      if ((t === 'tag' || t === 'attr' || t === 'prop') && v.length < 1) return;
      const key = v;
      if (!map.has(key)) map.set(key, { term: v, type: t, count: 0, lines: [] });
      const it = map.get(key);
      it.count++;
      if (it.lines[it.lines.length - 1] !== idx + 1) it.lines.push(idx + 1);
    });
  });
  return [...map.values()]
    .map(it => Object.assign(it, { kind: KIND[it.type] }))
    .sort((a, b) => b.count - a.count || a.term.localeCompare(b.term));
}

function dictKey(langId) {
  if (langId === 'c' || langId === 'cpp') return 'c_cpp';
  if (langId === 'js') return 'js_ts';
  if (langId === 'html' || langId === 'css') return 'web';
  return langId;
}

function lookup(term, langId) {
  const ld = DICT[dictKey(langId)] || {};
  if (ld[term]) return ld[term];
  if (DICT.common[term]) return DICT.common[term];
  const lower = term.toLowerCase();
  for (const k in ld) if (k.toLowerCase() === lower) return ld[k];
  for (const k in DICT.common) if (k.toLowerCase() === lower) return DICT.common[k];
  return null;
}

function escapeHtml(s) {

}
function renderTokens(tokens) {

}
let toastTimer = null;

function hash32(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return h.toString(36);
}

function lineIsNoted(n) {
  return !!(n && n.note && n.tag !== 'blank' && !n.fallback);
}
function renderLines(res) {
  const html = [];
  let shown = 0;
  res.tokenLines.forEach((ts, idx) => {
    const n = res.lineNotes[idx];
    if (lineFilter === 'noted' && !lineIsNoted(n)) return;
    shown++;
    html.push('<div class="line-card" data-line="' + (idx + 1) + '">');
    html.push('<div class="code-row"><span class="lineno">' + (idx + 1) + '</span><span class="code-body">' + renderTokens(ts) + '</span></div>');
    if (n.tag === 'blank') {
      html.push('<div class="note"><span class="tag">空行</span><span class="fallback">（空行，用来分段）</span></div>');

/* ---------- AI 通道 ---------- */
const AI = {
  on: () => LS.get('ce.aion', '0') === '1',
  key: () => LS.get('ce.aikey', ''),
  base: () => (LS.get('ce.aibase', '') || 'https://api.deepseek.com').replace(/\/+$/, ''),
  model: () => LS.get('ce.aimodel', 'deepseek-flash'),
  ready() { return this.on() && !!this.key(); }
};
const AI_USAGE = {
  get total() { return parseInt(LS.get('ce.aitok', '0'), 10) || 0; },
  session: 0,
  add(u) {
    const t = (u && u.total_tokens) || 0;
    this.session += t;
    LS.set('ce.aitok', String(this.total + t));
    updateUsageText();
  }
};
function updateUsageText() {
  const el = $('aiUsage');
  if (!el) return;
  el.textContent = '本次已用 ' + AI_USAGE.session + ' tokens · 累计 ' + AI_USAGE.total + ' tokens';
}
function aiCacheAll() {
  try { return JSON.parse(LS.get('ce.aicache', '{}')) || {}; } catch (e) { return {}; }
}
function aiCacheKey(kind, code, extra) {
  return kind + '|' + AI.model() + '|' + hash32(code + '\u0000' + (extra || ''));
}
function aiCacheGet(kind, code, extra) {
  const all = aiCacheAll();
  return all[aiCacheKey(kind, code, extra)] || '';
}
function aiCacheSet(kind, code, extra, text) {
  const all = aiCacheAll();
  all[aiCacheKey(kind, code, extra)] = text;
  const keys = Object.keys(all);
  while (keys.length > 24) delete all[keys.shift()];
  LS.set('ce.aicache', JSON.stringify(all));
}

class AIError extends Error {}

async function aiErrorText(resp) {
  let detail = '';
  try {
    const j = await resp.json();
    detail = (j && j.error && (j.error.message || j.error.code)) || '';
  } catch (e) {}
  const map = {
    400: '请求有问题（可能是代码太长或格式不对）',
    401: 'Key 无效或已被撤销',
    402: '余额不足',
    403: '没有权限',
    404: '接口地址不对',
    422: '请求参数不对',
    429: '太频繁了，等一下再试',
    500: '服务器出错了',
    503: '服务器忙'
  };
  const base = map[resp.status] || ('请求失败 ' + resp.status);
  return base + (detail ? '：' + detail : '');
}

async function readSSE(resp, onDelta) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', out = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      for (const line of chunk.split('\n')) {
        if (line.slice(0, 5) !== 'data:') continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let j;
        try { j = JSON.parse(payload); } catch (e) { continue; }
        if (j.usage) AI_USAGE.add(j.usage);
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if (d && d.content) {
          out += d.content;
          if (onDelta) onDelta(out);
        }
      }
    }
  }
  return out;
}

async function aiChat(opts) {
  const key = AI.key();
  if (!key) throw new AIError('还没填 API Key：右上「⋯」→ 设置 / AI 通道');
  const body = {
    model: AI.model(),
    messages: opts.messages,
    max_tokens: opts.maxTokens || 800,
    temperature: opts.temperature === undefined ? 0.3 : opts.temperature,
    stream: !!opts.stream
  };
  if (opts.json) body.response_format = { type: 'json_object' };
  if (opts.stream) body.stream_options = { include_usage: true };
  // 实测（2026-10-30）：thinking:disabled 在流式与非流式下都被接受，关掉思考省时省钱
  body.thinking = { type: 'disabled' };
  let resp;
  try {
    resp = await fetch(AI.base() + '/chat/completions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
      signal: opts.signal
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw e;
    throw new AIError('网络不通，先看看 Wi-Fi；离线解释照旧能用');
  }
  if (!resp.ok) throw new AIError(await aiErrorText(resp));
  if (!opts.stream) {
    const j = await resp.json();
    if (j.usage) AI_USAGE.add(j.usage);
    const m = j.choices && j.choices[0] && j.choices[0].message;
    return (m && m.content) || '';
  }
  return readSSE(resp, opts.onDelta);
}

function stopAI() {
  if (aiRun) {
    try { aiRun.abort(); } catch (e) {}
    aiRun = null;
  }
}
function newAbort() {
  stopAI();
  const c = new AbortController();
  aiRun = c;
  return c;
}

async function runOverallAI() {
  if (!AI.ready()) { openSettings(); return; }

  if (!code) { toast('先粘代码'); setView('code'); return; }
  ensureAiOverall();

  $('aiStop').hidden = true;
  if (cached) {
    out.textContent = cached;
    note.textContent = '这一段是之前算过、直接读的缓存，没有再花钱。';
    runBtn.textContent = '重新生成';
    return;
  }
  const ctrl = newAbort();
  runBtn.disabled = true;
  $('aiStop').hidden = false;
  note.textContent = '正在生成…';
  note.classList.remove('ai-err');
  out.textContent = '';
  out.innerHTML = '<span class="ai-cursor">●</span>';

  try {
    text = await aiChat({

        { role: 'user', content: '语言：' + langLabel(currentLang(code)) + '\n代码：\n```\n' + code + '\n```\n请说明：1) 这段代码整体做什么；2) 关键步骤按执行顺序；3) 最容易出错或最值得注意的地方。分三段，短句，200 到 350 字。' }
      ],
      onDelta: all => { out.textContent = all; }
    });

    if (text) aiCacheSet('overall', code, '', text);
    note.textContent = '';
    runBtn.textContent = '重新生成';
  } catch (e) {
    if (e && e.name === 'AbortError') {
      out.textContent = (text || '') + '\n\n（已停止）';
      note.textContent = '已停止，已经出来的部分留着。';
    } else {
      out.textContent = text || '';
      note.textContent = (e && e.message) || '出错了';
      note.classList.add('ai-err');
    }
  } finally {
    aiRun = null;
    runBtn.disabled = false;
    $('aiStop').hidden = true;
  }
}

/* 2) 逐行 AI 补全 */
function missingLines(res) {
  const out = [];
  res.lineTexts.forEach((t, i) => {
    if (!t.trim()) return;
    const n = res.lineNotes[i];
    if (!n || n.fallback || !n.note) out.push(i + 1);
  });
  return out;
}
function stripFence(s) {
  let t = String(s || '').trim();
  if (t.startsWith('```')) t = t.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '');
  return t.trim();
}
async function runLinesAI() {
  if (!AI.ready()) { openSettings(); return; }
  const res = lastResult;
  if (!res) { toast('先点「解释」'); return; }
  const code = $('code').value.trim();
  const todo = missingLines(res);
  if (!todo.length) { toast('每一行都已经有说明了'); return; }
  const cacheKeyExtra = todo.join(',');
  const btn = $('btnAiLines');
  const cached = aiCacheGet('lines', code, cacheKeyExtra);
  if (cached) { applyAiLines(cached, res); toast('读到缓存，没花钱'); return; }
  btn.disabled = true;
  btn.textContent = 'AI 补全中…';
  try {
    const list = todo.map(n => n + ': ' + res.lineTexts[n - 1]).join('\n');
    const text = await aiChat({
      json: true,
      maxTokens: Math.min(2000, 200 + todo.length * 40),
      messages: [
        { role: 'system', content: sysBase() + '这次必须只输出一个 JSON 对象，形如 {"lines":[{"line":3,"note":"给变量 x 赋初值"}]}，不许有别的文字。' },
        { role: 'user', content: '语言：' + langLabel(res.lang) + '\n下面是需要解释的行（行号: 代码）：\n' + list + '\n请给每一行一条不超过 30 个汉字的中文说明，只解释这一行在做什么。' }
      ]
    });
    applyAiLines(text, res);
    aiCacheSet('lines', code, cacheKeyExtra, text);
  } catch (e) {
    toast((e && e.message) || 'AI 补全失败', 3200);
  } finally {
    btn.disabled = false;
    btn.textContent = 'AI 补全没讲的行';
  }
}
function applyAiLines(text, res) {
  let data = null;
  try { data = JSON.parse(stripFence(text)); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.lines)) { toast('AI 返回的格式没看懂，再点一次试试', 3000); return; }
  let n = 0;
  data.lines.forEach(item => {
    const ln = parseInt(item.line, 10);
    const note = String(item.note || '').trim();
    if (!ln || !note || ln < 1 || ln > res.lineNotes.length) return;
    res.lineNotes[ln - 1] = { note: note, tag: 'ai' };
    n++;
  });
  renderLines(res);
  toast('AI 补了 ' + n + ' 行');
}

/* 4) 追问 */
let askHistory = [];
async function sendAsk() {
  if (!AI.ready()) { openSettings(); return; }
  const input = $('askInput');
  const q = input.value.trim();
  if (!q) return;
  const code = $('code').value.trim();
  if (!code) { toast('先粘代码'); return; }
  input.value = '';
  const chat = $('aiChat');
  const me = document.createElement('div');
  me.className = 'ai-msg me';
  me.textContent = q;
  chat.appendChild(me);
  const bubble = document.createElement('div');
  bubble.className = 'ai-msg ai';
  bubble.textContent = '…';
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  const ctrl = newAbort();
  try {
    const msgs = [{ role: 'system', content: sysBase() + '回答要短，围绕这段代码，最多 4 句话。' }]
      .concat([{ role: 'user', content: '代码（' + langLabel(currentLang(code)) + '）：\n```\n' + code + '\n```' }])
      .concat(askHistory.slice(-6))
      .concat([{ role: 'user', content: q }]);
    const text = await aiChat({
      stream: true,
      maxTokens: 500,
      signal: ctrl.signal,
      messages: msgs,
      onDelta: all => { bubble.textContent = all; chat.scrollTop = chat.scrollHeight; }
    });
    bubble.textContent = text || '（没返回内容）';
    askHistory.push({ role: 'user', content: q }, { role: 'assistant', content: text });
    if (askHistory.length > 12) askHistory = askHistory.slice(-12);
  } catch (e) {
    if (e && e.name === 'AbortError') bubble.textContent = '（已停止）';
    else bubble.textContent = (e && e.message) || '出错了';
  } finally {
    aiRun = null;
  }
}

/* ---------- 剪贴板 ---------- */
async function readClipboard() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) {
      const t = await navigator.clipboard.readText();
      if (t) return t;
    }
  } catch (e) {}
  try {
    const C = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard;
    if (C && C.read) {
      const r = await C.read();
      if (r && r.value) return r.value;
    }
  } catch (e) {}
  return '';
}
async function pasteIntoCode() {
  const t = await readClipboard();
  const codeEl = $('code');
  if (!t) {
    codeEl.focus();
    toast('读不到剪贴板：长按输入框手动粘贴');
    return;
  }
  codeEl.value = t;
  saveCode();
  syncGutter();
  doExplain();
  toast('已粘贴 ' + t.split('\n').length + ' 行');
}
async function copyCode() {
  const t = $('code').value;
  if (!t) { toast('没代码可复制'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(t); }
    else {
      const C = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard;
      if (C && C.write) await C.write({ string: t });
      else throw new Error('no clipboard');
    }
    toast('已复制');
  } catch (e) {
    toast('复制不了，长按输入框全选手动复制');
  }
}

$('miAbout').addEventListener('click', () => {
  closeSheets();
  toast('代码解释器 ' + APP_VERSION + ' · 离线词典 + DeepSeek AI', 3000);
});
$('aiSave').addEventListener('click', saveSettings);
$('aiClear').addEventListener('click', () => { LS.del('ce.aikey'); $('aiKey').value = ''; toast('Key 已清掉'); });
$('aiClearCache').addEventListener('click', () => { LS.del('ce.aicache'); toast('AI 缓存已清'); });
$('code').addEventListener('input', () => { syncGutter(); queueSave(); });
$('code').addEventListener('scroll', syncGutter);
$('code').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveCode(); doExplain(); setView('overall'); }
});
$('lang').addEventListener('change', () => { saveCode(); if ($('code').value.trim()) doExplain(); });
$('tab-lines').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (!j) return;
  e.stopPropagation();
  jumpToLine(parseInt(j.dataset.jump, 10));
});
$('tab-keywords').addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { jumpToLine(parseInt(jump.dataset.jump, 10)); return; }
  const aiBtn = e.target.closest('[data-ai-word]');
  if (aiBtn) { runWordAI(aiBtn.dataset.aiWord, aiBtn.closest('.kw-item')); return; }
  const item = e.target.closest('.kw-item');
  if (item) item.classList.toggle('open');
});

/* ---------- 键盘 / 视口 ---------- */
function fitViewport() {
  if (!window.visualViewport) return;
  document.documentElement.style.setProperty('--vvh', Math.round(window.visualViewport.height) + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
  fitViewport();
}

/* ---------- 原生壳 ---------- */
if (nativePlatform) {
  const P = window.Capacitor.Plugins || {};
  if (P.App && P.App.addListener) {
    P.App.addListener('backButton', () => {
      if (currentView !== 'code') setView('code');
      else if (P.App.exitApp) P.App.exitApp();
    });
  }
  if (P.StatusBar) {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      P.StatusBar.setStyle({ style: dark ? 'DARK' : 'LIGHT' });
      P.StatusBar.setBackgroundColor({ color: dark ? '#161b22' : '#ffffff' });
    } catch (e) {}
  }
}

/* ---------- 启动 ---------- */
const APP_VERSION = '1.0.0';
$('lang').value = LS.get('ce.lang', 'auto');
const savedCode = LS.get('ce.code', '');
if (savedCode) $('code').value = savedCode;
syncGutter();
if ($('code').value.trim()) doExplain();
refreshAIUI();
setView('code');
$('verText').textContent = '版本 ' + APP_VERSION + ' · ' + (nativePlatform ? 'app' : 'pwa');

/* 桌面/主屏快捷方式：?paste=1 进来就直接读剪贴板 */
if (/[?&]paste=1(&|$)/.test(location.search)) {
  try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  setTimeout(pasteIntoCode, 260);
}

/* Service Worker：原生壳里跳过（资源在 APK 里，走 SW 反而会卡住旧版本） */
if (!nativePlatform && 'serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>
